<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Benutzerverwaltung – FS25 Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg:#1A1917; --panel:#232120; --panel2:#2C2A27; --line:#363330; --text:#ECE8DE; --muted:#A29B8B; --green:#37714A; --lime:#8CCB5E; --gold:#F2B33D; --clay:#D9805F; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:Barlow,system-ui,sans-serif; font-variant-numeric:tabular-nums; }
    button,input,select { font:inherit; }
    button { color:inherit; }
    :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
    .nav { position:sticky; top:0; z-index:20; height:56px; background:rgba(26,25,23,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
    .nav-inner { max-width:1400px; height:100%; margin:auto; padding:0 24px; display:flex; align-items:center; gap:20px; }
    .brand { display:flex; align-items:center; gap:9px; color:var(--text); text-decoration:none; font:700 18px 'Barlow Semi Condensed',sans-serif; white-space:nowrap; }
    .nav-links { display:flex; gap:4px; }
    .nav-link { padding:7px 11px; border-radius:8px; color:var(--muted); text-decoration:none; font-size:14px; }
    .nav-link:hover,.nav-link.active { color:var(--text); background:var(--panel2); }
    .account { margin-left:auto; display:flex; align-items:center; gap:9px; min-width:0; }
    .account img { width:30px; height:30px; border-radius:50%; }
    .account-name { max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:600; }
    .logout { color:var(--muted); text-decoration:none; font-size:12px; }
    .logout:hover { color:var(--text); }
    main { max-width:1400px; margin:auto; padding:30px 24px 50px; }
    h1,h2 { font-family:'Barlow Semi Condensed',sans-serif; margin:0; }
    h1 { font-size:34px; line-height:1.1; }
    .muted { color:var(--muted); }
    .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; }
    .page-head p { margin:6px 0 0; font-size:14px; }
    .btn { border:1px solid var(--line); border-radius:8px; padding:8px 13px; background:var(--panel2); cursor:pointer; font-weight:600; }
    .btn:hover { border-color:#5b554c; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:18px; }
    .stat,.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; }
    .stat { padding:16px 18px; }
    .stat span { display:block; color:var(--muted); font-size:13px; }
    .stat strong { display:block; margin-top:4px; font:700 26px 'Barlow Semi Condensed',sans-serif; }
    .panel { padding:18px; }
    .toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .search,.select { border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:8px; padding:8px 10px; }
    .search { min-width:250px; flex:1; max-width:420px; }
    .feedback { min-height:20px; margin:0 0 12px; color:var(--muted); font-size:13px; }
    .feedback.error { color:#f0ad91; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:10px; }
    .table { min-width:980px; }
    .thead,.user-row { display:grid; grid-template-columns:minmax(220px,1.1fr) 125px minmax(370px,1.5fr) minmax(260px,1fr); gap:16px; align-items:center; }
    .thead { padding:9px 14px; color:var(--muted); font-size:12px; border-bottom:1px solid var(--line); }
    .user-row { padding:13px 14px; }
    .user-row + .user-row { border-top:1px solid var(--line); }
    .identity { display:flex; align-items:center; gap:11px; min-width:0; }
    .identity img { width:38px; height:38px; border-radius:50%; flex:none; }
    .identity strong,.identity small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .identity strong { font-size:14px; }
    .identity small { margin-top:2px; color:var(--muted); font-size:11px; }
    .status { display:inline-flex; padding:3px 9px; border-radius:999px; color:var(--status); background:color-mix(in srgb,var(--status) 18%,transparent); font-size:12px; font-weight:600; }
    .permissions { display:grid; grid-template-columns:repeat(3,minmax(110px,1fr)); gap:7px 10px; }
    .permission { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; white-space:nowrap; }
    .permission input { width:16px; height:16px; margin:0; accent-color:var(--lime); }
    .permission input:disabled { opacity:.4; }
    .save-rights { margin-top:9px; }
    .actions { display:flex; flex-wrap:wrap; gap:7px; }
    .action { padding:5px 9px; border:1px solid var(--line); border-radius:7px; background:var(--panel2); color:var(--muted); cursor:pointer; font-size:12px; font-weight:600; }
    .action:hover { color:var(--text); border-color:#5b554c; }
    .action.approve { color:var(--lime); }
    .action.reject,.action.block { color:var(--clay); }
    .empty { padding:35px; text-align:center; color:var(--muted); }
    @media(max-width:760px){ .nav-inner,main{padding-left:14px;padding-right:14px}.nav-links{display:none}.account-name{display:none}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:29px}.page-head{align-items:flex-start;flex-direction:column}.search{max-width:none;width:100%} }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="var(--lime)" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5" fill="var(--lime)" fill-opacity=".35"/></svg>
        FS25 Companion
      </a>
      <nav class="nav-links"><a class="nav-link" href="/">Dashboard</a><a class="nav-link active" href="/admin">Admin</a></nav>
      <div class="account"><img id="avatar" alt=""><span id="username" class="account-name"></span><a class="logout" href="/api/auth/logout">Abmelden</a></div>
    </div>
  </header>

  <main>
    <div class="page-head">
      <div><h1>Benutzerverwaltung</h1><p class="muted">Website-Zugänge und individuelle Berechtigungen verwalten.</p></div>
      <button id="reload" class="btn" type="button">Neu laden</button>
    </div>

    <section class="stats" aria-label="Benutzerübersicht">
      <div class="stat"><span>Alle Nutzer</span><strong id="totalCount">–</strong></div>
      <div class="stat"><span>Wartend</span><strong id="pendingCount" style="color:var(--gold)">–</strong></div>
      <div class="stat"><span>Freigeschaltet</span><strong id="approvedCount" style="color:var(--lime)">–</strong></div>
      <div class="stat"><span>Gesperrt/abgelehnt</span><strong id="deniedCount" style="color:var(--clay)">–</strong></div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <input id="search" class="search" type="search" placeholder="Nach Name oder Discord-ID suchen …">
        <select id="statusFilter" class="select" aria-label="Status filtern"><option value="all">Alle Status</option><option value="pending">Wartend</option><option value="approved">Angenommen</option><option value="rejected">Abgelehnt</option><option value="blocked">Gesperrt</option></select>
      </div>
      <p id="feedback" class="feedback" role="status"></p>
      <div class="table-wrap">
        <div class="table">
          <div class="thead"><span>Benutzer</span><span>Status</span><span>Berechtigungen</span><span>Zugriff verwalten</span></div>
          <div id="users"><div class="empty">Benutzer werden geladen …</div></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const STATUS = { pending:['Wartend','#F2B33D'], approved:['Angenommen','#8CCB5E'], rejected:['Abgelehnt','#D9805F'], blocked:['Gesperrt','#ef6b6b'] };
    let currentUser = null;
    let users = [];

    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    async function api(url, options = {}) {
      const response = await fetch(url, { credentials:'same-origin', ...options, headers:{'Content-Type':'application/json',...(options.headers || {})} });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Die Anfrage ist fehlgeschlagen.');
      return data;
    }
    function setFeedback(text, error = false) { const el=document.getElementById('feedback'); el.textContent=text; el.classList.toggle('error',error); }
    function permission(user, key, label) {
      const disabled = !currentUser.is_super_admin || user.is_super_admin;
      return `<label class="permission"><input type="checkbox" data-permission="${key}" ${user[key]?'checked':''} ${disabled?'disabled':''}><span>${label}</span></label>`;
    }
    function render() {
      const query = document.getElementById('search').value.trim().toLowerCase();
      const filter = document.getElementById('statusFilter').value;
      const order = {pending:0,approved:1,rejected:2,blocked:3};
      const visible = [...users].filter(user => (filter==='all'||user.status===filter) && (!query || `${user.display_name} ${user.username} ${user.discord_id}`.toLowerCase().includes(query))).sort((a,b)=>(order[a.status]??9)-(order[b.status]??9)||new Date(b.created_at)-new Date(a.created_at));
      document.getElementById('totalCount').textContent=users.length;
      document.getElementById('pendingCount').textContent=users.filter(user=>user.status==='pending').length;
      document.getElementById('approvedCount').textContent=users.filter(user=>user.status==='approved').length;
      document.getElementById('deniedCount').textContent=users.filter(user=>['rejected','blocked'].includes(user.status)).length;
      document.getElementById('users').innerHTML = visible.map(user => {
        const [statusLabel,statusColor]=STATUS[user.status]||[user.status,'var(--muted)'];
        const locked=user.is_super_admin||user.discord_id===currentUser.id;
        const actions=locked?`<span class="muted" style="font-size:12px">${user.is_super_admin?'Hauptadmin':'Eigenes Konto'}</span>`:`${user.status!=='approved'?`<button class="action approve" data-status="approved">Annehmen</button>`:''}${user.status!=='rejected'?`<button class="action reject" data-status="rejected">Ablehnen</button>`:''}${user.status!=='blocked'?`<button class="action block" data-status="blocked">Sperren</button>`:''}${user.status!=='pending'?`<button class="action" data-status="pending">Auf wartend setzen</button>`:''}`;
        const save=currentUser.is_super_admin&&!user.is_super_admin?'<button class="action save-rights" data-save>Rechte speichern</button>':'';
        return `<div class="user-row" data-user-id="${esc(user.discord_id)}"><div class="identity"><img src="${esc(user.avatar)}" alt=""><div><strong>${esc(user.display_name)}</strong><small>${esc(user.username)} · ${esc(user.discord_id)}</small></div></div><div><span class="status" style="--status:${statusColor}">${esc(statusLabel)}</span></div><div><div class="permissions">${permission(user,'can_create_tasks','Aufgaben erstellen')}${permission(user,'can_delete_tasks','Aufgaben löschen')}${permission(user,'can_manage_users','Nutzer verwalten')}</div>${save}</div><div class="actions">${actions}</div></div>`;
      }).join('') || '<div class="empty">Keine passenden Benutzer gefunden.</div>';
    }
    async function loadUsers() {
      setFeedback('Benutzer werden geladen …');
      try { const data=await api('/api/admin/users'); users=data.users||[]; setFeedback(currentUser.is_super_admin?'':'Nur der Hauptadmin kann Berechtigungen ändern.'); render(); }
      catch(error){ setFeedback(error.message,true); }
    }
    document.getElementById('users').addEventListener('click', async event => {
      const row=event.target.closest('[data-user-id]'); if(!row)return;
      const statusButton=event.target.closest('[data-status]'); const saveButton=event.target.closest('[data-save]'); if(!statusButton&&!saveButton)return;
      try {
        if(statusButton) await api(`/api/admin/users/${encodeURIComponent(row.dataset.userId)}/status`,{method:'PATCH',body:JSON.stringify({status:statusButton.dataset.status})});
        if(saveButton){const permissions={};row.querySelectorAll('[data-permission]').forEach(input=>permissions[input.dataset.permission]=input.checked);await api(`/api/admin/users/${encodeURIComponent(row.dataset.userId)}/permissions`,{method:'PATCH',body:JSON.stringify({permissions})});}
        setFeedback('Änderungen gespeichert.'); await loadUsers();
      } catch(error){setFeedback(error.message,true);}
    });
    document.getElementById('reload').addEventListener('click',loadUsers);
    document.getElementById('search').addEventListener('input',render);
    document.getElementById('statusFilter').addEventListener('change',render);
    (async()=>{
      try {
        const auth=await api('/api/auth/me');
        if(!auth.loggedIn||!auth.user.is_approved||!auth.user.permissions?.can_manage_users){window.location.replace('/');return;}
        currentUser=auth.user;
        document.getElementById('username').textContent=currentUser.username;
        document.getElementById('avatar').src=currentUser.avatar||'https://cdn.discordapp.com/embed/avatars/0.png';
        if(currentUser.schema_ready===false){setFeedback('Führe zuerst supabase/schema.sql im Supabase SQL Editor aus.',true);return;}
        await loadUsers();
      } catch(error){window.location.replace('/');}
    })();
  </script>
</body>
</html>
