<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FS25 Farm-Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: {
  display: ['"Barlow Semi Condensed"', 'system-ui', 'sans-serif'],
  sans: ['Barlow', 'system-ui', 'sans-serif']
} } } };
</script>
<style>
  :root {
    color-scheme: dark; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #1A1917; --panel: #232120; --panel-2: #2C2A27; --line: #363330;
    --text: #ECE8DE; --muted: #A29B8B;
    --green: #2E5E3A; --green-hi: #37714A; --lime: #8CCB5E; --gold: #F2B33D; --clay: #D9805F; --sky: #6FA8C9;
  }
  html { scroll-padding-top: 72px; scroll-behavior: smooth; }
  body { background: #1A1917; color: var(--text); font-family: Barlow, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .muted { color: var(--muted); }
  .h2 { font-family: 'Barlow Semi Condensed', system-ui, sans-serif; font-size: 1.2rem; font-weight: 600; }
  button, input, select { font: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* Top navigation */
  .nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(26,25,23,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .nav a.lnk { padding: 6px 12px; border-radius: 8px; color: var(--muted); font-size: 14px; font-weight: 500; }
  .nav a.lnk:hover { color: var(--text); background: var(--panel-2); }
  .lang { position: relative; display: inline-flex; padding: 3px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); }
  .lang button { position: relative; z-index: 1; width: 42px; height: 26px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .lang button[aria-pressed="true"] { color: #F1F6EC; }
  .lang .thumb { position: absolute; top: 3px; left: 3px; width: 42px; height: 26px; border-radius: 999px; background: var(--green-hi); transition: transform .25s; }
  .lang[data-lang="de"] .thumb { transform: translateX(42px); }

  /* Toggle */
  .switch { position: relative; width: 44px; height: 24px; border-radius: 999px; background: var(--panel-2); border: 1px solid #4b4640; cursor: pointer; flex: none; transition: background .2s; }
  .switch .knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
  .switch[aria-checked="true"] { background: var(--green-hi); border-color: var(--green-hi); }
  .switch[aria-checked="true"] .knob { transform: translateX(20px); background: #F1F6EC; }

  /* Map */
  .live-map-card { position: relative; width: min(100%, 820px); aspect-ratio: 1/1; margin-inline: auto; overflow: hidden; border: 1px solid var(--line); border-radius: 11px; background:#22251d; cursor: grab; touch-action: none; }
  .live-map-card.dragging { cursor: grabbing; }
  .live-map-card::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 70px rgba(0,0,0,.36); }
  .live-map-world { position: absolute; inset: 0; transform-origin: 0 0; background-image: linear-gradient(rgba(12,18,13,.05),rgba(12,18,13,.16)), url('/assets/hof-bergmann-map.png'); background-size: 200% 200%; background-position: center; background-repeat: no-repeat; will-change: transform; }
  .live-map-markers { position: absolute; inset: 0; z-index: 5; overflow: hidden; pointer-events: none; }
  .map-object { position: absolute; z-index: 2; transform: translate(-50%,-50%); }
  .live-map-markers .map-object { transform: translate(-50%,-50%) scale(var(--marker-scale,1)); transform-origin: center; pointer-events: auto; will-change: left,top,transform; }
  .map-field { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; border: 2px solid rgba(236,232,222,.45); background: rgba(35,33,32,.78); color: #fff; font: 700 12px/1 'Barlow Semi Condensed',sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .map-field.owned { border-color: var(--lime); background: rgba(46,94,58,.88); }
  .map-vehicle { z-index: 4; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: #14202a; background: var(--sky); border: 2px solid #dcebf3; box-shadow: 0 3px 12px rgba(0,0,0,.55); }
  .map-player { z-index: 6; display: flex; align-items: center; gap: 6px; min-width: max-content; padding: 4px 8px 4px 5px; border-radius: 999px; background: rgba(20,20,18,.92); border: 2px solid var(--gold); box-shadow: 0 4px 15px rgba(0,0,0,.55); color: #fff; font-size: 12px; font-weight: 700; }
  .map-player-avatar { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--gold); color: #201b12; font-size: 11px; }
  .map-player small { display: block; max-width: 150px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 10px; font-weight: 500; }
  .map-legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 9px 2px 15px; color: var(--muted); font-size: 12px; }
  .map-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .map-legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .map-empty { position: absolute; inset: 0; z-index: 7; display: grid; place-items: center; padding: 30px; text-align: center; background: rgba(20,22,19,.68); color: var(--muted); }
  .map-zoom { position: absolute; z-index: 12; right: 12px; top: 12px; display: grid; gap: 6px; }
  .map-zoom button { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; border: 1px solid rgba(255,255,255,.18); background: rgba(24,24,22,.9); color: #fff; font-size: 20px; font-weight: 700; box-shadow: 0 3px 10px rgba(0,0,0,.35); cursor: pointer; }
  .map-zoom button:hover { background: rgba(55,113,74,.95); }
  .field-map-info { position: absolute; z-index: 14; left: 12px; bottom: 12px; width: min(310px,calc(100% - 24px)); padding: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.16); background: rgba(28,27,24,.95); box-shadow: 0 10px 30px rgba(0,0,0,.48); backdrop-filter: blur(8px); cursor: default; }
  .field-map-info[hidden] { display:none; }
  .field-map-info-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 11px; }
  .field-map-info-grid dt { color:var(--muted); font-size:11px; }
  .field-map-info-grid dd { margin:2px 0 0; font-size:13px; font-weight:600; }
  .field-info-close { width:28px; height:28px; display:grid; place-items:center; border-radius:7px; color:var(--muted); cursor:pointer; }
  .field-info-close:hover { color:#fff; background:var(--panel-2); }
  @media (max-width: 640px) { .live-map-card { width: 100%; } .map-player span { display: none; } }
  .bed { padding: 10px; border-radius: 10px;
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(135deg, #3b3a2c 0%, #2c3229 55%, #35332a 100%);
    background-size: 22px 22px, 22px 22px, auto; }
  .grid-fields { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); }
  .fcard { display: flex; flex-direction: column; gap: 6px; min-height: 148px; padding: 10px 11px 9px; border-radius: 9px; border: 1px solid transparent; outline: 2px solid transparent; outline-offset: 1px; transition: opacity .2s, background-color .2s, outline-color .2s; }
  .fcard.owned { background: var(--green); color: #F1F6EC; border-color: rgba(255,255,255,.07); }
  .fcard.owned:hover { background: var(--green-hi); }
  .fcard.unowned { background: rgba(0,0,0,.45); color: var(--muted); border-color: rgba(162,155,139,.3); }  /* 45% dark overlay, solid muted border, no dashes */
  .fcard.dim { opacity: .3; }
  .fcard.hl { outline-color: var(--gold); }
  .num { font-family: 'Barlow Semi Condensed', sans-serif; font-size: 1.7rem; font-weight: 700; line-height: 1; }
  .fcard.unowned .num { color: #c9c2b3; }
  .ico { display: flex; width: 28px; height: 28px; align-items: center; justify-content: center; }
  .ico img { width: 28px; height: 28px; object-fit: contain; }
  .fcard.owned .ico { color: rgba(241,246,236,.95); }
  .fcard.unowned .ico { color: rgba(162,155,139,.75); }
  .fcard.unowned .ico img { filter: grayscale(1) opacity(.7); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .sub { font-size: 12px; }
  .bar { height: 5px; border-radius: 3px; background: rgba(0,0,0,.3); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 3px; background: var(--f, var(--lime)); }
  .fcard.unowned .bar > i { background: rgba(162,155,139,.7); }
  .foot { margin-top: auto; padding-top: 7px; border-top: 1px solid rgba(255,255,255,.08); height: 30px; font-size: 12px; font-weight: 500; }
  .g { display: inline-flex; align-items: center; gap: 6px; line-height: 1; min-width: 0; height: 16px; }
  .g svg { flex: none; }
  .sd { width: 8px; height: 8px; border-radius: 50%; background: var(--f, var(--lime)); flex: none; }
  .fcard.unowned .sd { background: var(--muted); }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: inline-block; margin-left: 7px; vertical-align: middle; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); font-size: 13px; color: var(--muted); cursor: pointer; }
  .chip[aria-pressed="true"] { color: var(--text); border-color: var(--lime); }

  /* Sidebar, machines */
  .item { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 8px; }
  .item + .item { border-top: 1px solid var(--line); }
  .hit:hover { background: var(--panel-2); }
  .tile { width: 34px; height: 34px; border-radius: 8px; background: var(--panel-2); display: flex; align-items: center; justify-content: center; flex: none; color: var(--lime); }
  .tile img { width: 22px; height: 22px; object-fit: contain; }
  .mcard { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid transparent; }
  .mcard:hover { border-color: var(--line); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--d, var(--muted)); display: inline-block; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: rgba(0,0,0,.28); white-space: nowrap; }
  .pill.on { color: var(--gold); }

  /* Task board */
  .lbl { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .inp { width: 100%; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); }
  .inp:focus { outline: 2px solid var(--lime); outline-offset: 0; border-color: transparent; }
  .seg { display: flex; gap: 6px; }
  .seg label { flex: 1; position: relative; }
  .seg input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .seg span { display: block; text-align: center; padding: 7px 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-size: 13px; color: var(--muted); }
  .seg input:checked + span { color: #1A1917; font-weight: 600; background: var(--c); border-color: var(--c); }
  .seg input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 8px; background: var(--green-hi); color: #F1F6EC; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #418456; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 5px 12px; font-size: 13px; font-weight: 500; }
  .btn.ghost:hover { color: var(--text); background: var(--panel-2); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
  .tbl th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 500; font-size: 13px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .tbl td { padding: 4px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr.done td:not(:first-child):not(:last-child) { color: var(--muted); text-decoration: line-through; }
  .chk { position: relative; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; cursor: pointer; }
  .chk input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; margin: 0; }
  .chk .box { position: relative; width: 20px; height: 20px; border-radius: 6px; border: 2px solid #5b554c; transition: background .15s, border-color .15s; }
  .chk .box::after { content: ''; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #1A1917; border-width: 0 2px 2px 0; transform: rotate(45deg); opacity: 0; }
  .chk input:checked + .box { background: var(--lime); border-color: var(--lime); }
  .chk input:checked + .box::after { opacity: 1; }
  .chk input:focus-visible + .box { outline: 2px solid var(--gold); outline-offset: 2px; }
  .urg { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--c); white-space: nowrap; }
  .xbtn { width: 32px; height: 32px; border-radius: 8px; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .xbtn:hover { color: var(--clay); background: var(--panel-2); }
  section { scroll-margin-top: 72px; }

  /* Discord access gate */
  body.auth-locked .nav, body.auth-locked #dashboardRoot { filter: blur(10px); opacity: .35; pointer-events: none; user-select: none; }
  .auth-gate { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(12,12,11,.78); backdrop-filter: blur(5px); }
  .auth-gate[hidden] { display: none; }
  .auth-card [hidden] { display: none !important; }
  .auth-card { width: min(100%, 430px); padding: 30px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 24px 70px rgba(0,0,0,.45); text-align: center; }
  .discord-btn { display: inline-flex; width: 100%; align-items: center; justify-content: center; gap: 10px; margin-top: 20px; padding: 11px 18px; border-radius: 9px; background: #5865F2; color: white; font-weight: 600; transition: background .2s; }
  .discord-btn:hover { background: #4752C4; }
  .auth-error { margin-top: 14px; padding: 9px 11px; border-radius: 8px; border: 1px solid rgba(217,128,95,.45); background: rgba(217,128,95,.1); color: #f0ad91; font-size: 13px; }
  .auth-spinner { width: 28px; height: 28px; margin: 20px auto 0; border: 3px solid var(--line); border-top-color: var(--lime); border-radius: 50%; animation: auth-spin .8s linear infinite; }
  @keyframes auth-spin { to { transform: rotate(360deg); } }
  .status-badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--status-color) 18%, transparent); color: var(--status-color); }
  .permission-grid { display: grid; grid-template-columns: repeat(3, minmax(110px, 1fr)); gap: 6px 12px; }
  .permission-toggle { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .permission-toggle input { accent-color: var(--lime); width: 16px; height: 16px; }
  .admin-action { padding: 5px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
  .admin-action:hover { color: var(--text); border-color: #5b554c; }
  .admin-action.approve { color: var(--lime); }
  .admin-action.reject, .admin-action.block { color: var(--clay); }
  .admin-action:disabled, .permission-toggle input:disabled { opacity: .4; cursor: not-allowed; }
  .admin-user-row + .admin-user-row { border-top: 1px solid var(--line); }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .fcard, .switch, .switch .knob, .lang .thumb, .chk .box { transition: none; } }
</style>
</head>
<body class="min-h-screen antialiased auth-locked" id="top">

<!-- Discord authentication and approval gate -->
<div id="authGate" class="auth-gate" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="auth-card">
    <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl" style="background:var(--green);color:var(--lime)">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5" fill="currentColor" fill-opacity=".35"/></svg>
    </div>
    <h1 id="authTitle" class="font-display text-2xl font-bold">FS25 Companion</h1>
    <p id="authMessage" class="muted mt-2 text-sm">Anmeldung wird geprüft …</p>
    <p id="authError" class="auth-error" hidden></p>
    <div id="authSpinner" class="auth-spinner" aria-label="Anmeldung wird geprüft"></div>
    <a id="discordLogin" href="/api/auth/login" class="discord-btn" hidden>
      <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true"><path d="M19.5 5.3A16.3 16.3 0 0 0 15.4 4l-.5 1.1a15 15 0 0 0-5.8 0L8.6 4a16.5 16.5 0 0 0-4.1 1.3C1.9 9.1 1.2 12.8 1.6 16.4a16.6 16.6 0 0 0 5 2.5l1.2-1.7c-.7-.3-1.4-.7-2-1.2l.5-.4a11.8 11.8 0 0 0 11.4 0l.5.4c-.6.5-1.3.9-2 1.2l1.2 1.7a16.6 16.6 0 0 0 5-2.5c.5-4.2-.8-7.8-2.9-11.1ZM8.6 14.2c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Zm6.8 0c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Z"/></svg>
      Mit Discord anmelden
    </a>
    <a id="authLogout" href="/api/auth/logout" class="mt-4 inline-block text-sm muted hover:text-white" hidden>Mit anderem Konto anmelden</a>
  </div>
</div>

<!-- Top navigation -->
<header class="nav">
  <div class="mx-auto max-w-[1400px] px-4 sm:px-6 h-14 flex items-center gap-3">
    <a href="#top" class="flex items-center gap-2 font-display font-bold text-lg">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="var(--lime)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5" fill="var(--lime)" fill-opacity=".35"/></svg>
      <span>FS25 Companion</span>
    </a>
    <nav class="hidden md:flex items-center gap-1 ml-3">
      <a class="lnk" href="#map" data-i18n="navMap"></a>
      <a class="lnk" href="#machines" data-i18n="navMachines"></a>
      <a class="lnk" href="#tasks" data-i18n="navTasks"></a>
      <a class="lnk" href="/finances" data-i18n="navFinances"></a>
      <a id="adminNav" class="lnk" href="/admin" data-i18n="navAdmin" hidden></a>
    </nav>
    <div class="ml-auto flex items-center gap-3">
      <div id="players" class="hidden sm:flex -space-x-2"></div>
      <div id="authUser" class="hidden items-center gap-2 border-l pl-3" style="border-color:var(--line)">
        <img id="authAvatar" class="h-7 w-7 rounded-full" alt="Discord-Profilbild">
        <span id="authUsername" class="hidden sm:inline text-sm font-medium"></span>
        <a href="/api/auth/logout" class="muted text-xs hover:text-white">Abmelden</a>
      </div>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.7 5.6 3.7 9s-1.2 6.4-3.7 9c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3z"/></svg>
      <div id="lang" class="lang" role="group" data-i18n-aria="langLabel" data-lang="en">
        <span class="thumb"></span>
        <button type="button" data-lang="en" aria-pressed="true" title="English">EN</button>
        <button type="button" data-lang="de" aria-pressed="false" title="Deutsch">DE</button>
      </div>
    </div>
  </div>
</header>

<div id="dashboardRoot" class="mx-auto max-w-[1400px] px-4 sm:px-6 py-6">

  <div class="mb-5">
    <h1 id="farmTitle" class="font-display text-3xl sm:text-4xl font-bold tracking-tight">FS25 Farm-Dashboard</h1>
    <p id="farmSub" class="muted mt-1 text-sm" data-i18n="sub"></p>
  </div>

  <!-- Map + sidebar -->
  <div class="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_310px] gap-5 mb-5">
    <section id="map" class="panel p-4 sm:p-5" aria-labelledby="map-h">

      SUGARBEET: 'Zuckerrüben', COTTON: 'Baumwolle', SUGARCANE: 'Zuckerrohr', GRASS: 'Gras', PEA: 'Erbsen', SPINACH: 'Spinat', GREENBEAN: 'Grüne Bohnen', CARROT: 'Karotten',
      PARSNIP: 'Pastinaken', REDBEET: 'Rote Bete', RICE: 'Reis', HEMP: 'Hanf', SPELT: 'Dinkel' }

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let lang = store.get('lang') || ((navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en');

const t = (k, v) => {
  let s = i18n[lang][k] ?? i18n.en[k] ?? k;
  return v ? s.replace(/\{(\w+)\}/g, (m, x) => v[x] ?? m) : s;
};
const loc = () => (lang === 'de' ? 'de-DE' : 'en-US');
const money = v => new Intl.NumberFormat(loc(), { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(v);
const num1 = v => Number(v || 0).toLocaleString(loc(), { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const prettify = s => String(s || '').replace(/[_-]+/g, ' ').toLowerCase().replace(/^./, c => c.toUpperCase());

/* =====================================================================
   2. CROP ICON FRAMEWORK
   canon() normalizes whatever the telemetry server sends ("Sugar beet",
   "sugar-beet", "SUGARBEET") to UPPER_SNAKE_CASE.
   telemetryCropMapping maps those keys to files in your asset folder.
   Drop your icon files into assets/icons/ (check GIANTS Software's
   modding terms for using official FS25 artwork).
   Anything not listed here still works: cropSrc() derives
   assets/icons/<lowercase key>.png, and if that file is missing the <img>
   is swapped for a built-in SVG so the dashboard never shows a broken image.
   ===================================================================== */
const ICON_DIR = 'assets/icons/';
const telemetryCropMapping = {
  WHEAT: ICON_DIR + 'wheat.png', BARLEY: ICON_DIR + 'barley.png', OAT: ICON_DIR + 'oat.png', CANOLA: ICON_DIR + 'canola.png',
  SORGHUM: ICON_DIR + 'sorghum.png', SOYBEAN: ICON_DIR + 'soybean.png', SUNFLOWER: ICON_DIR + 'sunflower.png',
  MAIZE: ICON_DIR + 'maize.png', CORN: ICON_DIR + 'maize.png',
  POTATO: ICON_DIR + 'potato.png', POTATOES: ICON_DIR + 'potato.png',
  SUGARBEET: ICON_DIR + 'sugarbeet.png', SUGAR_BEET: ICON_DIR + 'sugarbeet.png', REDBEET: ICON_DIR + 'redbeet.png',
  COTTON: ICON_DIR + 'cotton.png', SUGARCANE: ICON_DIR + 'sugarcane.png', GRASS: ICON_DIR + 'grass.png',
  PEA: ICON_DIR + 'pea.png', SPINACH: ICON_DIR + 'spinach.png', GREENBEAN: ICON_DIR + 'greenbean.png',
  CARROT: ICON_DIR + 'carrot.png', PARSNIP: ICON_DIR + 'parsnip.png', RICE: ICON_DIR + 'rice.png',
  HEMP: ICON_DIR + 'hemp.png'   /* example of a custom or modded crop */
};
const canon = raw => String(raw || '').trim().toUpperCase().replace(/[\s-]+/g, '_');
const cropSrc = raw => telemetryCropMapping[canon(raw)] || `${ICON_DIR}${canon(raw).toLowerCase()}.png`;
const cropName = raw => i18n[lang].crops[canon(raw)] || i18n.en.crops[canon(raw)] || prettify(raw);
const cropImg = (raw, size = 28) =>
  `<img src="${cropSrc(raw)}" alt="${esc(cropName(raw))}" width="${size}" height="${size}" data-crop="${esc(canon(raw))}" data-size="${size}" decoding="async">`;

/* Built-in SVG fallbacks (24x24, currentColor) */
const n2 = v => +v.toFixed(2);
const svg = (inner, s = 24) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const FILL = 'fill="currentColor" stroke="none"';
const wheat = () => { let s = `<path d="M12 22V9"/><path ${FILL} d="M12 2.5c1.6 1.6 1.6 3.6 0 5.5-1.6-1.9-1.6-3.9 0-5.5z"/><g ${FILL}>`;
  [9.8, 14.8, 19.8].forEach(y => { s += `<path d="M11.2 ${y}C8.7 ${n2(y + .2)} 7 ${n2(y - 1.2)} 6.5 ${n2(y - 3.5)}c2.5-.1 4.2 1.2 4.7 3.5z"/><path d="M12.8 ${y}c2.5.2 4.2-1.2 4.7-3.5-2.5-.1-4.2 1.2-4.7 3.5z"/>`; }); return s + '</g>'; };
const barley = () => { let s = '<path d="M12 22V11"/>', g = '<path d="M12 4.6c1.1 1 1.1 2.4 0 3.8-1.1-1.4-1.1-2.8 0-3.8z"/>';
  [14.5, 11, 7.5].forEach(y => { g += `<path d="M11.4 ${y}c-1.6-.2-2.6-1.2-2.8-2.8 1.7.1 2.7 1 2.8 2.8z"/><path d="M12.6 ${y}c1.6-.2 2.6-1.2 2.8-2.8-1.7.1-2.7 1-2.8 2.8z"/>`;
    s += `<path d="M8.6 ${n2(y - 2.8)}L5.2 ${n2(y - 7.6)}M15.4 ${n2(y - 2.8)}L18.8 ${n2(y - 7.6)}"/>`; });
  return s + `<path d="M12 4.6V1.2"/><g ${FILL}>${g}</g>`; };
const sunflower = () => `<g ${FILL} fill-opacity=".55">${[0,45,90,135,180,225,270,315].map(a => `<ellipse cx="12" cy="4.9" rx="1.6" ry="2.7" transform="rotate(${a} 12 10)"/>`).join('')}</g><circle cx="12" cy="10" r="3.1" ${FILL}/><path d="M12 13.2V22"/><path d="M12 18.5c2.6-.1 4.2-1.3 4.8-3.7-2.7 0-4.3 1.2-4.8 3.7z"/>`;
const corn = () => { let k = ''; [4.6, 6.9, 9.2, 11.5].forEach(y => [10.3, 12, 13.7].forEach(x => k += `<circle cx="${x}" cy="${y}" r=".8"/>`));
  return `<ellipse cx="12" cy="8.6" rx="3.3" ry="6.2"/><g ${FILL}>${k}</g><path ${FILL} fill-opacity=".9" d="M12 22C6.8 21.2 5 16.5 6.2 11.5c2.6 1.4 4.6 4.6 5.8 10.5z"/><path ${FILL} fill-opacity=".9" d="M12 22c5.2-.8 7-5.5 5.8-10.5-2.6 1.4-4.6 4.6-5.8 10.5z"/>`; };
const potatoes = () => `<path d="M6.3 10C8 6.6 13.6 5.6 17 8.2c3 2.3 3.4 6.6.9 9.5-2.5 2.9-8.6 3.2-11.6 1C4 16.3 4.6 12.8 6.3 10z" fill="currentColor" fill-opacity=".22"/><g ${FILL}><circle cx="10.2" cy="11.5" r=".9"/><circle cx="14.6" cy="14.6" r=".9"/><circle cx="13.6" cy="9.6" r=".7"/><circle cx="9.5" cy="15.4" r=".7"/></g><path d="M12 6.1c0-1.7.9-2.9 2.6-3.4.1 1.8-.7 3-2.6 3.4z"/>`;
const hemp = () => { const leaf = (len, ang) => { const w = 1.35 * len / 12;
  return `<path transform="rotate(${ang} 12 15)" d="M12 15c${n2(-w)} ${n2(-len*.28)} ${n2(-w)} ${n2(-len*.7)} 0 ${n2(-len)}c${n2(w)} ${n2(len*.3)} ${n2(w)} ${n2(len*.72)} 0 ${n2(len)}z"/>`; };
  return `<g ${FILL} fill-opacity=".9">${[[12.5,0],[11,-30],[11,30],[8.6,-58],[8.6,58],[6,-82],[6,82]].map(([l, a]) => leaf(l, a)).join('')}</g><path d="M12 15v7"/>`; };
const sprout = () => '<path d="M12 21V11"/><path d="M12 13.5C8 13.5 6 11 6 7.5c4 0 6 2.2 6 6z"/><path d="M12 11.5c0-4 2-6.5 6.5-6.5 0 4.2-2.2 6.5-6.5 6.5z"/>';
const fallbackIcons = { WHEAT: wheat, BARLEY: barley, OAT: barley, SUNFLOWER: sunflower, MAIZE: corn, CORN: corn, POTATO: potatoes, POTATOES: potatoes, HEMP: hemp };

/* <img> load errors do not bubble, so listen in the capture phase */
document.addEventListener('error', e => {
  const img = e.target;
  if (!img || img.tagName !== 'IMG' || !img.dataset.crop) return;
  const fn = fallbackIcons[img.dataset.crop] || sprout;
  img.outerHTML = `<span role="img" aria-label="${esc(img.alt)}" style="display:inline-flex">${svg(fn(), +img.dataset.size)}</span>`;
}, true);

const ui = {
  tag: '<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><path d="M7 7h.01"/>',
  coin: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.2"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  tractor: '<circle cx="7" cy="16" r="4.2"/><circle cx="19" cy="18" r="2.4"/><path d="M5 11.8V5.5h6l1.5 4.5H18l2.5 4.5"/><path d="M11 16.5h5.5"/>',
  combine: '<rect x="2" y="12" width="4.5" height="6" rx="1"/><path d="M6.5 15H12V6.5h6.5V15H22v3H7"/><circle cx="11" cy="19.5" r="2"/><circle cx="19" cy="19.5" r="1.7"/>',
  truck: '<path d="M2 17V7h10v10M12 10h5l3.5 3.5V17H12"/><circle cx="6.5" cy="17.5" r="1.9"/><circle cx="16.5" cy="17.5" r="1.9"/>'
};
const uiSvg = (k, s = 14) => svg(ui[k], s).replace('stroke-width="1.5"', 'stroke-width="1.7"');

/* Telemetry collections stay empty until the FS25 integration is added. */
const STAGE_ORDER = ['fallow', 'plowed', 'sown', 'growing', 'ready'];
const stageColor = { fallow: '#B9A97F', plowed: '#D19563', sown: '#E0CB6E', growing: '#9BD46A', ready: '#F2B33D' };
const stageLabel = k => (i18n[lang]['st_' + k] ?? i18n.en['st_' + k]) || prettify(k);
let fields = [];
let machines = [];
let gamePlayers = [];
let liveMapBounds = { minX: -1024, maxX: 1024, minZ: -1024, maxZ: 1024 };
let liveMapZoom = 1, liveMapPanX = 0, liveMapPanY = 0;
let selectedMapField = null, liveFarmName = '';
const STATUS_DOT = { working: 'var(--lime)', hauling: 'var(--sky)', idle: 'var(--muted)' };
let players = [];
const PRESETS = ['p_plow', 'p_cultivate', 'p_sow', 'p_fertilize', 'p_harvest', 'p_mow', 'p_bale', 'p_haul'];
const URG_COLOR = { low: 'var(--sky)', medium: 'var(--gold)', high: 'var(--clay)' };
const URG_RANK = { high: 0, medium: 1, low: 2 };

let tasks = [];
let currentPermissions = { can_create_tasks: false, can_delete_tasks: false, can_manage_users: false };

/* =====================================================================
   4. RENDERING
   ===================================================================== */
const $ = id => document.getElementById(id);
const sum = a => a.reduce((x, y) => x + y, 0);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const opName = m => (m.helper ? t('helper', { n: m.helper }) : m.op || null);
const workOn = n => machines.find(m => m.field === n && m.status === 'working');
const fieldByN = n => fields.find(f => f.n === n);
let activeStage = 'all', showUnowned = true;
const visibleFields = () => fields.filter(f => f.owned || showUnowned);

function renderPlayers() {
  $('players').innerHTML = players.map(p => `<span title="${esc(p.username)} · Online" class="relative inline-flex w-8 h-8 rounded-full" style="border:2px solid var(--bg)">
    <img src="${esc(p.avatar)}" alt="${esc(p.username)}" class="w-full h-full rounded-full object-cover">
    <span aria-hidden="true" style="position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:var(--lime);border:2px solid var(--bg)"></span>
  </span>`).join('');
}

function mapPosition(x, z) {
  x = Number(x); z = Number(z);
  if (!Number.isFinite(x) || !Number.isFinite(z)) return null;
  const b = liveMapBounds || {}, minX = Number(b.minX), maxX = Number(b.maxX), minZ = Number(b.minZ), maxZ = Number(b.maxZ);
  if (![minX,maxX,minZ,maxZ].every(Number.isFinite) || maxX <= minX || maxZ <= minZ) return null;
  return {
    left: Math.max(1.5, Math.min(98.5, (x - minX) / (maxX - minX) * 100)),
    top: Math.max(1.5, Math.min(98.5, (z - minZ) / (maxZ - minZ) * 100))
  };
}

function updateLiveMapTransform() {
  const map = $('liveMap'), world = $('liveMapWorld'), markers = $('liveMapMarkers');
  if (!map || !world || !markers) return;
  world.style.transform = `translate(${liveMapPanX}px,${liveMapPanY}px) scale(${liveMapZoom})`;
  const width = map.clientWidth, height = map.clientHeight;
  const markerScale = Math.max(.38, Math.pow(liveMapZoom, -.48));
  markers.querySelectorAll('.map-object[data-map-x]').forEach(marker => {
    marker.style.left = `${liveMapPanX + Number(marker.dataset.mapX) / 100 * width * liveMapZoom}px`;
    marker.style.top = `${liveMapPanY + Number(marker.dataset.mapY) / 100 * height * liveMapZoom}px`;
    marker.style.setProperty('--marker-scale', String(markerScale));
  });
}

function renderFieldMapInfo(fieldNumber) {
  const box = $('fieldMapInfo'), field = fields.find(f => Number(f.n) === Number(fieldNumber));
  if (!box || !field) { if (box) box.hidden = true; return; }
  selectedMapField = field.n;
  const owner = field.ownerName || (field.owned ? (liveFarmName || t('ownFarm')) : (field.ownerFarmId > 0 ? `${t('fieldOwner')} ${field.ownerFarmId}` : t('noOwner')));
  box.innerHTML = `<div class="flex items-center justify-between gap-3"><div><div class="muted text-xs">${t('liveMapTitle')}</div><div class="font-display text-xl font-bold">${t('fieldN',{n:field.n})}</div></div><button type="button" class="field-info-close" aria-label="Schließen">${uiSvg('x',16)}</button></div>
    <dl class="field-map-info-grid"><div><dt>${t('fieldCrop')}</dt><dd>${esc(cropName(field.crop))}</dd></div><div><dt>${t('fieldSize')}</dt><dd>${num1(field.ha)} ha</dd></div><div><dt>${t('fieldOwner')}</dt><dd>${esc(owner)}</dd></div><div><dt>${t('fieldState')}</dt><dd>${esc(stageLabel(field.stage))}</dd></div><div><dt>${t('fieldGrowth')}</dt><dd>${Math.max(0,Math.min(100,Number(field.pct)||0))}%</dd></div></dl>`;
  box.hidden = false;
}

function renderLiveMap() {
  const markers = $('liveMapMarkers');
  if (!markers) return;
  const positionedFields = fields.filter(f => mapPosition(f.x, f.z));
  const positionedMachines = machines.filter(m => mapPosition(m.x, m.z));
  const positionedPlayers = gamePlayers.filter(p => mapPosition(p.x, p.z));
  $('liveMapStatus').textContent = t('liveMapCount', { p: gamePlayers.length, v: machines.length });
  if (!positionedFields.length && !positionedMachines.length && !positionedPlayers.length) {
    markers.innerHTML = `<div class="map-empty">${t('liveMapEmpty')}</div>`;
    updateLiveMapTransform();
    return;
  }
  const fieldMarkers = positionedFields.map(f => {
    const p = mapPosition(f.x, f.z);
    return `<button type="button" class="map-object map-field ${f.owned ? 'owned' : ''}" data-field="${f.n}" data-map-x="${p.left}" data-map-y="${p.top}" title="${esc(t('fieldN',{n:f.n}) + ' · ' + cropName(f.crop))}">${f.n}</button>`;
  }).join('');
  const vehicleMarkers = positionedMachines.map(m => {
    const p = mapPosition(m.x, m.z);
    const detail = `${m.name}${m.field ? ' · ' + t('fieldN',{n:m.field}) : ''}`;
    return `<span class="map-object map-vehicle" data-map-x="${p.left}" data-map-y="${p.top}" title="${esc(detail)}">${svg(ui.tractor,16)}</span>`;
  }).join('');
  const playerMarkers = positionedPlayers.map(player => {
    const p = mapPosition(player.x, player.z);
    const linkedVehicle = player.vehicleName || machines.find(m => m.op && String(m.op).toLowerCase() === String(player.name).toLowerCase())?.name || '';
    const field = player.fieldNumber || machines.find(m => m.name === linkedVehicle)?.field;
    const detail = [linkedVehicle, field ? t('fieldN',{n:field}) : ''].filter(Boolean).join(' · ') || t('yard');
    const initial = String(player.name || '?').trim().charAt(0).toUpperCase() || '?';
    return `<span class="map-object map-player" data-map-x="${p.left}" data-map-y="${p.top}" title="${esc(player.name + ' · ' + detail)}"><b class="map-player-avatar">${esc(initial)}</b><span>${esc(player.name)}<small>${esc(detail)}</small></span></span>`;
  }).join('');
  markers.innerHTML = fieldMarkers + vehicleMarkers + playerMarkers;
  updateLiveMapTransform();
  if (selectedMapField != null) renderFieldMapInfo(selectedMapField);
}

function cardHTML(f) {
  const color = stageColor[f.stage] || '#B9A97F';
  const dim = activeStage !== 'all' && activeStage !== f.stage ? ' dim' : '';
  const pct = Math.max(0, Math.min(100, Number(f.pct) || 0));
  const w = f.owned ? workOn(f.n) : null;
  const footer = f.owned
    ? `<span class="g"><span class="truncate">${w ? esc(t(w.task) + ', ' + opName(w)) : t('noActivity')}</span></span>`
    : `<span class="g">${uiSvg('tag')}${t('forSale')}</span><span class="g" style="color:var(--text);font-weight:600">${uiSvg('coin')}${f.price != null ? money(f.price) : t('onRequest')}</span>`;
  return `<article class="fcard ${f.owned ? 'owned' : 'unowned'}${dim}" data-n="${f.n}" style="--f:${color}">
    <div class="row"><span class="num">${f.n}${w ? `<span class="live" title="${t('wip')}"></span>` : ''}</span><span class="ico">${cropImg(f.crop, 28)}</span></div>
    <div class="row"><span class="font-semibold text-[15px] truncate">${esc(cropName(f.crop))}</span><span class="sub" style="opacity:.8">${num1(f.ha)} ha</span></div>
    <div class="row sub"><span class="g"><span class="sd"></span>${esc(stageLabel(f.stage))}</span><span>${pct}%</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="row foot">${footer}</div></article>`;
}

function renderMap() {
  renderLiveMap();
  if (!fields.length) {
    $('fieldControls').hidden = true;
    $('map-sum').textContent = t('telemetryEmpty');
    $('fields').innerHTML = `<div class="muted text-sm text-center" style="grid-column:1/-1;padding:42px 18px">${t('fieldsEmpty')}</div>`;
    return;
  }
  $('fieldControls').hidden = false;
  $('fields').innerHTML = visibleFields().map(cardHTML).join('');
  const owned = fields.filter(f => f.owned);
  $('map-sum').textContent = t('mapSum', { owned: owned.length, ha: num1(sum(owned.map(f => f.ha))), ready: owned.filter(f => f.stage === 'ready').length }) +
    (showUnowned ? t('mapSale', { n: fields.length - owned.length }) : '');
}

function renderFilters() {
  if (!fields.length) { $('filters').innerHTML = ''; return; }
  const list = visibleFields(), counts = {};
  list.forEach(f => counts[f.stage] = (counts[f.stage] || 0) + 1);
  const keys = [...STAGE_ORDER, ...Object.keys(counts).filter(k => !STAGE_ORDER.includes(k))];
  $('filters').innerHTML = `<button type="button" class="chip" data-stage="all" aria-pressed="${activeStage === 'all'}">${t('allFields')} ${list.length}</button>` +
    keys.map(k => `<button type="button" class="chip" data-stage="${esc(k)}" aria-pressed="${activeStage === k}"><span class="sd" style="--f:${stageColor[k] || '#B9A97F'}"></span>${esc(stageLabel(k))} ${counts[k] || 0}</button>`).join('');
}

function renderOps() {
  const ops = machines.filter(m => m.field && m.status === 'working').sort((a, b) => a.field - b.field);
  $('ops-sum').textContent = t('opsSum', { n: ops.length });
  $('ops').innerHTML = ops.length ? ops.map(m => {
    const f = fieldByN(m.field);
    return `<li class="item hit" tabindex="0" data-field="${m.field}"><span class="tile">${f ? cropImg(f.crop, 22) : ''}</span>
      <div class="min-w-0 flex-1"><div class="text-sm font-semibold">${t('fieldN', { n: m.field })}</div><div class="muted text-xs truncate">${esc(t(m.task) + ', ' + opName(m))}</div></div>
      <span class="dot" style="--d:var(--lime)" title="${t('s_working')}"></span></li>`;
  }).join('') : `<li class="muted text-sm py-3">${t('opsEmpty')}</li>`;
}

function renderYield() {
  const owned = fields.filter(f => f.owned);
  if (!owned.length) {
    $('yield-sum').textContent = t('telemetryEmpty');
    $('yield').innerHTML = '';
    return;
  }
  $('yield-sum').textContent = t('yieldSum', { n: owned.filter(f => f.stage === 'ready').length });
  $('yield').innerHTML = owned.filter(f => f.stage === 'growing').sort((a, b) => a.eta - b.eta || b.pct - a.pct).slice(0, 5).map(f => `
    <li class="item hit" tabindex="0" data-field="${f.n}"><span class="tile">${cropImg(f.crop, 22)}</span>
      <div class="min-w-0 flex-1"><div class="flex justify-between text-sm"><span class="font-semibold">${t('fieldN', { n: f.n })} <span class="muted font-normal">${esc(cropName(f.crop))}</span></span><span class="muted text-xs">${t(f.eta === 1 ? 'dayOne' : 'dayMany', { n: f.eta })}</span></div>
      <div class="bar mt-1.5"><i style="width:${f.pct}%;background:var(--lime)"></i></div></div></li>`).join('');
}

function renderMachines() {
  if (!machines.length) {
    $('machList').innerHTML = `<li class="muted text-sm text-center" style="grid-column:1/-1;padding:28px 12px">${t('machinesEmpty')}</li>`;
    $('mach-sum').textContent = t('telemetryEmpty');
    return;
  }
  $('machList').innerHTML = machines.map(m => {
    const who = opName(m), loc2 = m.field ? `<span class="pill on">${t('fieldN', { n: m.field })}</span>` : `<span class="pill muted">${t(m.status === 'hauling' ? 'onRoad' : 'inYard')}</span>`;
    return `<li class="mcard hit" tabindex="0" ${m.field ? `data-field="${m.field}"` : ''}><span class="tile" style="color:var(--text)">${svg(ui[m.kind] || ui.tractor, 22)}</span>
      <div class="min-w-0 flex-1"><div class="font-semibold text-sm truncate">${esc(m.name)}</div>
      <div class="muted text-xs truncate">${esc(t(m.type))}</div><div class="muted text-xs truncate">${esc(t(m.task) + (who ? ', ' + who : ''))}</div>
      <div class="text-xs mt-1 flex items-center gap-1.5"><span class="dot" style="--d:${STATUS_DOT[m.status]}"></span>${t('s_' + m.status)}</div></div>${loc2}</li>`;
  }).join('');
  const act = machines.filter(m => m.status !== 'idle').length;
  $('mach-sum').textContent = t('machSum', { a: act, i: machines.length - act });
}

/* ---------- Task board ---------- */
const taskName = x => (x.nameKey ? t(x.nameKey) : x.name);

async function apiRequest(url, options = {}) {
  const response = await fetch(url, {
    credentials: 'same-origin',
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || 'Die Anfrage ist fehlgeschlagen.');
  return data;
}

function applyTaskPermissions() {
  $('taskForm').style.display = currentPermissions.can_create_tasks ? '' : 'none';
  $('taskPermissionNotice').hidden = currentPermissions.can_create_tasks;
  $('clearDone').style.display = currentPermissions.can_delete_tasks ? '' : 'none';
  renderTasks();
}

async function loadTasks() {
  try {
    const data = await apiRequest('/api/tasks');
    tasks = data.tasks || [];
    renderTasks();
  } catch (error) {
    $('fErr').textContent = error.message;
  }
}

async function loadTelemetry() {
  try {
    const data = await apiRequest('/api/telemetry/state');
    const payload = data.payload;
    if (!payload) return;
    fields = (payload.fields || []).map(f => ({
      n: Number(f.number ?? f.farmlandId ?? f.id), crop: String(f.crop || 'UNKNOWN').toUpperCase(),
      ha: Number(f.areaHa) || 0, owned: f.owned === true, stage: f.stage || 'fallow',
      pct: Number(f.progress) || 0, eta: Number(f.etaDays) || 0, price: f.price == null ? null : Number(f.price),
      x: f.x == null ? null : Number(f.x), z: f.z == null ? null : Number(f.z),
      ownerFarmId: f.ownerFarmId == null ? null : Number(f.ownerFarmId), ownerName: f.ownerName || null
    })).filter(f => Number.isFinite(f.n));
    machines = (payload.vehicles || []).map(v => ({
      id: v.id, name: v.name || 'Fahrzeug', type: v.type || 'Fahrzeug', kind: v.kind || 'tractor',
      field: v.fieldNumber == null ? null : Number(v.fieldNumber), status: v.status || 'idle',
      task: v.task || (v.status === 'working' ? 'Arbeitet' : 'Geparkt'), op: v.operator || null,
      x: v.x == null ? null : Number(v.x), z: v.z == null ? null : Number(v.z)
    }));
    gamePlayers = (payload.players || []).map(p => ({
      id: p.id, name: p.name || p.nickname || 'Spieler', x: p.x == null ? null : Number(p.x), z: p.z == null ? null : Number(p.z),
      fieldNumber: p.fieldNumber == null ? null : Number(p.fieldNumber), vehicleName: p.vehicleName || null, vehicleId: p.vehicleId || null
    }));
    if (payload.mapBounds) liveMapBounds = payload.mapBounds;
    liveFarmName = payload.farm?.name || payload.savegame?.name || '';
    if (payload.savegame?.name || payload.savegame?.mapName) $('farmTitle').textContent = payload.savegame.name || payload.savegame.mapName;
    $('farmSub').textContent = `${payload.savegame?.mapName || 'FS25'} · ${data.connected ? 'Live verbunden' : 'Telemetrie zuletzt empfangen'}${data.last_seen_at ? ` · ${new Date(data.last_seen_at).toLocaleString(loc())}` : ''}`;
    renderFilters(); renderMap(); renderOps(); renderYield(); renderMachines(); renderForm();
  } catch (error) { console.warn('Telemetrie konnte nicht geladen werden:', error.message); }
}

function renderForm() {
  const sel = $('fField'), cur = sel.value;
  sel.innerHTML = `<option value="">${t('yard')}</option>` + fields.filter(f => f.owned).map(f => `<option value="${f.n}">${t('fieldN', { n: f.n })}, ${esc(cropName(f.crop))}</option>`).join('');
  sel.value = cur;
  $('taskList').innerHTML = PRESETS.map(k => `<option value="${esc(t(k))}"></option>`).join('');
  $('playerList').innerHTML = players.map(p => `<option value="${esc(p.username)}"></option>`).join('');
}

function renderTasks(focusId) {
  const list = [...tasks].sort((a, b) => a.done - b.done || URG_RANK[a.urgency] - URG_RANK[b.urgency] || b.id - a.id);
  $('taskBody').innerHTML = list.length ? list.map(x => `
    <tr class="${x.done ? 'done' : ''}" ${x.field ? `data-field="${x.field}"` : ''}>
      <td><label class="chk"><input type="checkbox" data-id="${x.id}" ${x.done ? 'checked' : ''} aria-label="${esc(taskName(x))}"><span class="box"></span></label></td>
      <td class="font-medium">${esc(taskName(x))}</td>
      <td>${x.field ? t('fieldN', { n: x.field }) : t('yard')}</td>
      <td>${x.player ? esc(x.player) : `<span class="muted">${t('unassigned')}</span>`}</td>
      <td><span class="urg" style="--c:${URG_COLOR[x.urgency]}">${t(x.urgency)}</span></td>
      <td>${currentPermissions.can_delete_tasks ? `<button type="button" class="xbtn" data-del="${x.id}" aria-label="${t('removeTask')}">${uiSvg('x', 16)}</button>` : ''}</td></tr>`).join('')
    : `<tr><td colspan="6" class="muted text-center" style="padding:28px 10px">${t('noTasks')}</td></tr>`;
  const done = tasks.filter(x => x.done).length;
  $('task-sum').textContent = t('taskSum', { o: tasks.length - done, d: done });
  if (focusId) { const c = document.querySelector(`input[data-id="${focusId}"]`); if (c) c.focus(); }
}

$('taskForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('fName').value.trim();
  if (!name) { $('fErr').textContent = t('errTask'); $('fName').focus(); return; }
  $('fErr').textContent = '';
  try {
    await apiRequest('/api/tasks', { method: 'POST', body: JSON.stringify({
      name,
      field: $('fField').value ? +$('fField').value : null,
      player: $('fPlayer').value.trim(),
      urgency: document.querySelector('input[name="urg"]:checked').value
    }) });
    $('fName').value = '';
    await loadTasks();
    $('fName').focus();
  } catch (error) {
    $('fErr').textContent = error.message;
  }
});
$('taskBody').addEventListener('change', async e => {
  const c = e.target.closest('input[data-id]'); if (!c) return;
  try {
    await apiRequest(`/api/tasks/${encodeURIComponent(c.dataset.id)}`, { method: 'PATCH', body: JSON.stringify({ done: c.checked }) });
    const x = tasks.find(k => String(k.id) === c.dataset.id); if (x) x.done = c.checked;
    renderTasks(c.dataset.id);
  } catch (error) {
    c.checked = !c.checked;
    $('fErr').textContent = error.message;
  }
});
$('taskBody').addEventListener('click', async e => {
  const b = e.target.closest('button[data-del]'); if (!b) return;
  try {
    await apiRequest(`/api/tasks/${encodeURIComponent(b.dataset.del)}`, { method: 'DELETE' });
    tasks = tasks.filter(k => String(k.id) !== b.dataset.del);
    renderTasks();
  } catch (error) {
    $('fErr').textContent = error.message;
  }
});
$('clearDone').addEventListener('click', async () => {
  try {
    await apiRequest('/api/tasks/completed', { method: 'DELETE' });
    tasks = tasks.filter(x => !x.done);
    renderTasks();
  } catch (error) {
    $('fErr').textContent = error.message;
  }
});
$('fName').addEventListener('input', () => { $('fErr').textContent = ''; });

/* ---------- Map controls and cross-highlighting ---------- */
$('filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  activeStage = activeStage === b.dataset.stage ? 'all' : b.dataset.stage; renderFilters(); renderMap();
});
$('tog').addEventListener('click', () => {
  showUnowned = !showUnowned; $('tog').setAttribute('aria-checked', String(showUnowned)); renderFilters(); renderMap();
});
function setLiveMapZoom(value, clientX, clientY) {
  const map = $('liveMap'), oldZoom = liveMapZoom;
  const nextZoom = Math.max(1, Math.min(5, Number(value) || 1));
  const rect = map.getBoundingClientRect();
  const anchorX = Number.isFinite(clientX) ? clientX - rect.left : rect.width / 2;
  const anchorY = Number.isFinite(clientY) ? clientY - rect.top : rect.height / 2;
  if (nextZoom !== oldZoom) {
    const worldX = (anchorX - liveMapPanX) / oldZoom;
    const worldY = (anchorY - liveMapPanY) / oldZoom;
    liveMapPanX = anchorX - worldX * nextZoom;
    liveMapPanY = anchorY - worldY * nextZoom;
  }
  liveMapZoom = nextZoom;
  if (nextZoom === 1) liveMapPanX = liveMapPanY = 0;
  updateLiveMapTransform();
}
$('mapZoomIn').addEventListener('click', () => setLiveMapZoom(liveMapZoom + .5));
$('mapZoomOut').addEventListener('click', () => setLiveMapZoom(liveMapZoom - .5));
$('mapZoomReset').addEventListener('click', () => { liveMapPanX = liveMapPanY = 0; setLiveMapZoom(1); });
$('liveMap').addEventListener('wheel', e => { e.preventDefault(); setLiveMapZoom(liveMapZoom + (e.deltaY < 0 ? .35 : -.35), e.clientX, e.clientY); }, { passive: false });
let liveMapDrag = null;
$('liveMap').addEventListener('pointerdown', e => {
  if (e.target.closest('button,.field-map-info')) return;
  liveMapDrag = { x: e.clientX, y: e.clientY, panX: liveMapPanX, panY: liveMapPanY };
  $('liveMap').classList.add('dragging');
  $('liveMap').setPointerCapture(e.pointerId);
});
$('liveMap').addEventListener('pointermove', e => {
  if (!liveMapDrag) return;
  liveMapPanX = liveMapDrag.panX + e.clientX - liveMapDrag.x;
  liveMapPanY = liveMapDrag.panY + e.clientY - liveMapDrag.y;
  updateLiveMapTransform();
});
const stopLiveMapDrag = () => { liveMapDrag = null; $('liveMap').classList.remove('dragging'); };
$('liveMap').addEventListener('pointerup', stopLiveMapDrag);
$('liveMap').addEventListener('pointercancel', stopLiveMapDrag);
$('liveMap').addEventListener('click', e => {
  if (e.target.closest('.field-info-close')) {
    selectedMapField = null;
    $('fieldMapInfo').hidden = true;
    return;
  }
  const marker = e.target.closest('.map-field[data-field]');
  if (marker) renderFieldMapInfo(marker.dataset.field);
});
window.addEventListener('resize', updateLiveMapTransform);
function bindHighlight(el) {
  const set = (e, on) => { const r = e.target.closest('[data-field]'); if (!r) return; const c = document.querySelector(`.fcard[data-n="${r.dataset.field}"]`); if (c) c.classList.toggle('hl', on); };
  ['mouseover', 'focusin'].forEach(ev => el.addEventListener(ev, e => set(e, true)));
  ['mouseout', 'focusout'].forEach(ev => el.addEventListener(ev, e => set(e, false)));
}
['ops', 'yield', 'machList', 'taskBody'].forEach(id => bindHighlight($(id)));

/* ---------- Language switch ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $('lang').dataset.lang = lang;
  document.querySelectorAll('#lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  $('fErr').textContent = '';
  renderPlayers(); renderFilters(); renderMap(); renderOps(); renderYield(); renderMachines(); renderForm(); renderTasks();
}
$('lang').addEventListener('click', e => {
  const b = e.target.closest('button[data-lang]'); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang; store.set('lang', lang); applyLang();
});

applyLang();
</script>

<script>
(() => {
  const gate = document.getElementById('authGate');
  const message = document.getElementById('authMessage');
  const errorBox = document.getElementById('authError');
  const spinner = document.getElementById('authSpinner');
  const login = document.getElementById('discordLogin');
  const gateLogout = document.getElementById('authLogout');
  const authUser = document.getElementById('authUser');
  const authAvatar = document.getElementById('authAvatar');
  const authUsername = document.getElementById('authUsername');
  let presenceTimer = null;
  let taskSyncTimer = null;
  let eventStream = null;

  const errors = {
    auth_failed: 'Die Discord-Anmeldung ist fehlgeschlagen. Bitte versuche es erneut.',
    discord_denied: 'Die Anmeldung wurde bei Discord abgebrochen.',
    invalid_state: 'Die Anmeldesitzung ist abgelaufen. Bitte starte die Anmeldung erneut.',
    no_code: 'Discord hat keinen Anmeldecode zurückgegeben.',
    session_failed: 'Die Sitzung konnte nicht gespeichert werden. Bitte versuche es erneut.'
  };

  function showGate(text, { showLogin = false, showLogout = false, loading = false } = {}) {
    document.body.classList.add('auth-locked');
    gate.hidden = false;
    message.textContent = text;
    login.hidden = !showLogin;
    gateLogout.hidden = !showLogout;
    spinner.hidden = !loading;
  }

  function unlock(user) {
    currentPermissions = { ...currentPermissions, ...(user.permissions || {}) };
    authUsername.textContent = user.username || 'Discord-Nutzer';
    if (user.avatar) {
      authAvatar.src = user.avatar;
      authAvatar.hidden = false;
    } else {
      authAvatar.hidden = true;
    }
    authUser.classList.remove('hidden');
    authUser.classList.add('flex');
    document.getElementById('adminNav').hidden = !currentPermissions.can_manage_users;
    applyTaskPermissions();
    document.body.classList.remove('auth-locked');
    gate.hidden = true;
    loadTasks();
    loadTelemetry();
    startPresence();
    startRealtime();
  }

  async function loadOnlineUsers() {
    try {
      const data = await apiRequest('/api/online-users');
      players = data.users || [];
      renderPlayers();
      renderForm();
    } catch (error) {
      console.warn('Online-Nutzer konnten nicht geladen werden:', error.message);
    }
  }

  async function refreshPresence() {
    try {
      await apiRequest('/api/presence', { method: 'POST' });
      await loadOnlineUsers();
    } catch (error) {
      console.warn('Online-Status konnte nicht aktualisiert werden:', error.message);
    }
  }

  function startPresence() {
    if (presenceTimer) return;
    refreshPresence();
    presenceTimer = window.setInterval(refreshPresence, 30000);
  }

  function startRealtime() {
    if (eventStream) return;
    eventStream = new EventSource('/api/events');
    eventStream.addEventListener('tasks-changed', () => loadTasks());
    eventStream.addEventListener('presence-changed', () => loadOnlineUsers());
    eventStream.addEventListener('telemetry-changed', () => loadTelemetry());
    eventStream.onerror = () => console.warn('Live-Verbindung wird automatisch neu aufgebaut.');
    taskSyncTimer = window.setInterval(loadTasks, 15000);
  }

  async function checkAuth() {
    try {
      const response = await fetch('/api/auth/me', { cache: 'no-store', credentials: 'same-origin' });
      const data = await response.json();

      if (!response.ok) throw new Error(data.error || 'auth_check_failed');
      if (!data.loggedIn) {
        showGate('Melde dich mit deinem Discord-Konto an, um das Farm-Dashboard zu öffnen.', { showLogin: true });
        return;
      }

      if (data.user.status === 'blocked' || data.user.status === 'rejected') {
        showGate(data.user.status === 'blocked' ? 'Dein Zugriff auf dieses Dashboard wurde gesperrt.' : 'Dein Zugang wurde abgelehnt.', { showLogout: true });
        return;
      }

      if (!data.user.is_approved) {
        showGate('Erfolgreich angemeldet. Dein Zugriff wartet noch auf die Freigabe durch den Administrator.', { showLogout: true, loading: true });
        window.setTimeout(checkAuth, 10000);
        return;
      }

      unlock(data.user);
    } catch (error) {
      console.error('Authentifizierungsprüfung fehlgeschlagen:', error);
      showGate('Der Anmeldestatus konnte gerade nicht geprüft werden. Bitte versuche es erneut.', { showLogin: true });
    }
  }

  const params = new URLSearchParams(window.location.search);
  const errorCode = params.get('error');
  if (errorCode) {
    errorBox.textContent = errors[errorCode] || 'Die Anmeldung konnte nicht abgeschlossen werden.';
    errorBox.hidden = false;
    window.history.replaceState({}, document.title, '/');
  }

  checkAuth();
})();
</script>
</body>
</html>
