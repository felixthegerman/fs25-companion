<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hollow Creek Farm, FS25 Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: {
  display: ['"Barlow Semi Condensed"', 'system-ui', 'sans-serif'],
  sans: ['Barlow', 'system-ui', 'sans-serif']
} } } };
</script>
<style>
  :root {
    color-scheme: dark; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #1A1917; --panel: #232120; --panel-2: #2C2A27; --line: #363330;
    --text: #ECE8DE; --muted: #A29B8B;
    --green: #2E5E3A; --green-hi: #37714A; --lime: #8CCB5E; --gold: #F2B33D; --clay: #D9805F; --sky: #6FA8C9;
  }
  html { scroll-padding-top: 72px; scroll-behavior: smooth; }
  body { background: #1A1917; color: var(--text); font-family: Barlow, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .muted { color: var(--muted); }
  .h2 { font-family: 'Barlow Semi Condensed', system-ui, sans-serif; font-size: 1.2rem; font-weight: 600; }
  button, input, select { font: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* Top navigation */
  .nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(26,25,23,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .nav a.lnk { padding: 6px 12px; border-radius: 8px; color: var(--muted); font-size: 14px; font-weight: 500; }
  .nav a.lnk:hover { color: var(--text); background: var(--panel-2); }
  .lang { position: relative; display: inline-flex; padding: 3px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); }
  .lang button { position: relative; z-index: 1; width: 42px; height: 26px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .lang button[aria-pressed="true"] { color: #F1F6EC; }
  .lang .thumb { position: absolute; top: 3px; left: 3px; width: 42px; height: 26px; border-radius: 999px; background: var(--green-hi); transition: transform .25s; }
  .lang[data-lang="de"] .thumb { transform: translateX(42px); }

  /* Toggle */
  .switch { position: relative; width: 44px; height: 24px; border-radius: 999px; background: var(--panel-2); border: 1px solid #4b4640; cursor: pointer; flex: none; transition: background .2s; }
  .switch .knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
  .switch[aria-checked="true"] { background: var(--green-hi); border-color: var(--green-hi); }
  .switch[aria-checked="true"] .knob { transform: translateX(20px); background: #F1F6EC; }

  /* Map */
  .bed { padding: 10px; border-radius: 10px;
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(135deg, #3b3a2c 0%, #2c3229 55%, #35332a 100%);
    background-size: 22px 22px, 22px 22px, auto; }
  .grid-fields { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); }
  .fcard { display: flex; flex-direction: column; gap: 6px; min-height: 148px; padding: 10px 11px 9px; border-radius: 9px; border: 1px solid transparent; outline: 2px solid transparent; outline-offset: 1px; transition: opacity .2s, background-color .2s, outline-color .2s; }
  .fcard.owned { background: var(--green); color: #F1F6EC; border-color: rgba(255,255,255,.07); }
  .fcard.owned:hover { background: var(--green-hi); }
  .fcard.unowned { background: rgba(0,0,0,.45); color: var(--muted); border-color: rgba(162,155,139,.3); }  /* 45% dark overlay, solid muted border, no dashes */
  .fcard.dim { opacity: .3; }
  .fcard.hl { outline-color: var(--gold); }
  .num { font-family: 'Barlow Semi Condensed', sans-serif; font-size: 1.7rem; font-weight: 700; line-height: 1; }
  .fcard.unowned .num { color: #c9c2b3; }
  .ico { display: flex; width: 28px; height: 28px; align-items: center; justify-content: center; }
  .ico img { width: 28px; height: 28px; object-fit: contain; }
  .fcard.owned .ico { color: rgba(241,246,236,.95); }
  .fcard.unowned .ico { color: rgba(162,155,139,.75); }
  .fcard.unowned .ico img { filter: grayscale(1) opacity(.7); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .sub { font-size: 12px; }
  .bar { height: 5px; border-radius: 3px; background: rgba(0,0,0,.3); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 3px; background: var(--f, var(--lime)); }
  .fcard.unowned .bar > i { background: rgba(162,155,139,.7); }
  .foot { margin-top: auto; padding-top: 7px; border-top: 1px solid rgba(255,255,255,.08); height: 30px; font-size: 12px; font-weight: 500; }
  .g { display: inline-flex; align-items: center; gap: 6px; line-height: 1; min-width: 0; height: 16px; }
  .g svg { flex: none; }
  .sd { width: 8px; height: 8px; border-radius: 50%; background: var(--f, var(--lime)); flex: none; }
  .fcard.unowned .sd { background: var(--muted); }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: inline-block; margin-left: 7px; vertical-align: middle; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); font-size: 13px; color: var(--muted); cursor: pointer; }
  .chip[aria-pressed="true"] { color: var(--text); border-color: var(--lime); }

  /* Sidebar, machines */
  .item { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 8px; }
  .item + .item { border-top: 1px solid var(--line); }
  .hit:hover { background: var(--panel-2); }
  .tile { width: 34px; height: 34px; border-radius: 8px; background: var(--panel-2); display: flex; align-items: center; justify-content: center; flex: none; color: var(--lime); }
  .tile img { width: 22px; height: 22px; object-fit: contain; }
  .mcard { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid transparent; }
  .mcard:hover { border-color: var(--line); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--d, var(--muted)); display: inline-block; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: rgba(0,0,0,.28); white-space: nowrap; }
  .pill.on { color: var(--gold); }

  /* Task board */
  .lbl { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .inp { width: 100%; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); }
  .inp:focus { outline: 2px solid var(--lime); outline-offset: 0; border-color: transparent; }
  .seg { display: flex; gap: 6px; }
  .seg label { flex: 1; position: relative; }
  .seg input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .seg span { display: block; text-align: center; padding: 7px 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-size: 13px; color: var(--muted); }
  .seg input:checked + span { color: #1A1917; font-weight: 600; background: var(--c); border-color: var(--c); }
  .seg input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 8px; background: var(--green-hi); color: #F1F6EC; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #418456; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 5px 12px; font-size: 13px; font-weight: 500; }
  .btn.ghost:hover { color: var(--text); background: var(--panel-2); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
  .tbl th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 500; font-size: 13px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .tbl td { padding: 4px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr.done td:not(:first-child):not(:last-child) { color: var(--muted); text-decoration: line-through; }
  .chk { position: relative; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; cursor: pointer; }
  .chk input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; margin: 0; }
  .chk .box { position: relative; width: 20px; height: 20px; border-radius: 6px; border: 2px solid #5b554c; transition: background .15s, border-color .15s; }
  .chk .box::after { content: ''; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #1A1917; border-width: 0 2px 2px 0; transform: rotate(45deg); opacity: 0; }
  .chk input:checked + .box { background: var(--lime); border-color: var(--lime); }
  .chk input:checked + .box::after { opacity: 1; }
  .chk input:focus-visible + .box { outline: 2px solid var(--gold); outline-offset: 2px; }
  .urg { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--c); white-space: nowrap; }
  .xbtn { width: 32px; height: 32px; border-radius: 8px; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .xbtn:hover { color: var(--clay); background: var(--panel-2); }
  section { scroll-margin-top: 72px; }

  /* Discord access gate */
  body.auth-locked .nav, body.auth-locked #dashboardRoot { filter: blur(10px); opacity: .35; pointer-events: none; user-select: none; }
  .auth-gate { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(12,12,11,.78); backdrop-filter: blur(5px); }
  .auth-gate[hidden] { display: none; }
  .auth-card [hidden] { display: none !important; }
  .auth-card { width: min(100%, 430px); padding: 30px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 24px 70px rgba(0,0,0,.45); text-align: center; }
  .discord-btn { display: inline-flex; width: 100%; align-items: center; justify-content: center; gap: 10px; margin-top: 20px; padding: 11px 18px; border-radius: 9px; background: #5865F2; color: white; font-weight: 600; transition: background .2s; }
  .discord-btn:hover { background: #4752C4; }
  .auth-error { margin-top: 14px; padding: 9px 11px; border-radius: 8px; border: 1px solid rgba(217,128,95,.45); background: rgba(217,128,95,.1); color: #f0ad91; font-size: 13px; }
  .auth-spinner { width: 28px; height: 28px; margin: 20px auto 0; border: 3px solid var(--line); border-top-color: var(--lime); border-radius: 50%; animation: auth-spin .8s linear infinite; }
  @keyframes auth-spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .fcard, .switch, .switch .knob, .lang .thumb, .chk .box { transition: none; } }
</style>
</head>
<body class="min-h-screen antialiased auth-locked" id="top">

<!-- Discord authentication and approval gate -->
<div id="authGate" class="auth-gate" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="auth-card">
    <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl" style="background:var(--green);color:var(--lime)">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5" fill="currentColor" fill-opacity=".35"/></svg>
    </div>
    <h1 id="authTitle" class="font-display text-2xl font-bold">FS25 Companion</h1>
    <p id="authMessage" class="muted mt-2 text-sm">Anmeldung wird geprüft …</p>
    <p id="authError" class="auth-error" hidden></p>
    <div id="authSpinner" class="auth-spinner" aria-label="Anmeldung wird geprüft"></div>
    <a id="discordLogin" href="/api/auth/login" class="discord-btn" hidden>
      <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true"><path d="M19.5 5.3A16.3 16.3 0 0 0 15.4 4l-.5 1.1a15 15 0 0 0-5.8 0L8.6 4a16.5 16.5 0 0 0-4.1 1.3C1.9 9.1 1.2 12.8 1.6 16.4a16.6 16.6 0 0 0 5 2.5l1.2-1.7c-.7-.3-1.4-.7-2-1.2l.5-.4a11.8 11.8 0 0 0 11.4 0l.5.4c-.6.5-1.3.9-2 1.2l1.2 1.7a16.6 16.6 0 0 0 5-2.5c.5-4.2-.8-7.8-2.9-11.1ZM8.6 14.2c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Zm6.8 0c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Z"/></svg>
      Mit Discord anmelden
    </a>
    <a id="authLogout" href="/api/auth/logout" class="mt-4 inline-block text-sm muted hover:text-white" hidden>Mit anderem Konto anmelden</a>
  </div>
</div>

<!-- Top navigation -->
<header class="nav">
  <div class="mx-auto max-w-[1400px] px-4 sm:px-6 h-14 flex items-center gap-3">
    <a href="#top" class="flex items-center gap-2 font-display font-bold text-lg">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="var(--lime)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5" fill="var(--lime)" fill-opacity=".35"/></svg>
      <span>FS25 Companion</span>
    </a>
    <nav class="hidden md:flex items-center gap-1 ml-3">
      <a class="lnk" href="#map" data-i18n="navMap"></a>
      <a class="lnk" href="#machines" data-i18n="navMachines"></a>
      <a class="lnk" href="#tasks" data-i18n="navTasks"></a>
    </nav>
    <div class="ml-auto flex items-center gap-3">
      <div id="players" class="hidden sm:flex -space-x-2"></div>
      <div id="authUser" class="hidden items-center gap-2 border-l pl-3" style="border-color:var(--line)">
        <img id="authAvatar" class="h-7 w-7 rounded-full" alt="Discord-Profilbild">
        <span id="authUsername" class="hidden sm:inline text-sm font-medium"></span>
        <a href="/api/auth/logout" class="muted text-xs hover:text-white">Abmelden</a>
      </div>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.7 5.6 3.7 9s-1.2 6.4-3.7 9c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3z"/></svg>
      <div id="lang" class="lang" role="group" data-i18n-aria="langLabel" data-lang="en">
        <span class="thumb"></span>
        <button type="button" data-lang="en" aria-pressed="true" title="English">EN</button>
        <button type="button" data-lang="de" aria-pressed="false" title="Deutsch">DE</button>
      </div>
    </div>
  </div>
</header>

<div id="dashboardRoot" class="mx-auto max-w-[1400px] px-4 sm:px-6 py-6">

  <div class="mb-5">
    <h1 class="font-display text-3xl sm:text-4xl font-bold tracking-tight">Hollow Creek Farm</h1>
    <p class="muted mt-1 text-sm" data-i18n="sub"></p>
  </div>

  <!-- Finances -->
  <section class="panel p-4 sm:p-5 mb-5 grid grid-cols-2 lg:grid-cols-[1.3fr_1fr_1fr_1fr_1.5fr] gap-5 items-center" aria-labelledby="fin-h">
    <div class="col-span-2 lg:col-span-1">
      <h2 id="fin-h" class="muted text-sm" data-i18n="balance"></h2>
      <p id="balance" class="font-display text-4xl font-bold tracking-tight mt-0.5"></p>
    </div>
    <div><p class="muted text-sm" data-i18n="income"></p><p id="inc" class="font-display text-2xl font-semibold" style="color:var(--lime)"></p></div>
    <div><p class="muted text-sm" data-i18n="maint"></p><p id="mnt" class="font-display text-2xl font-semibold" style="color:var(--clay)"></p></div>
    <div><p class="muted text-sm" data-i18n="net"></p><p id="net" class="font-display text-2xl font-semibold"></p></div>
    <div class="col-span-2 lg:col-span-1">
      <p class="muted text-xs mb-1" data-i18n="chartCap"></p>
      <div id="chart" class="flex items-end gap-2 h-14" role="img" data-i18n-aria="chartAria"></div>
    </div>
  </section>

  <!-- Map + sidebar -->
  <div class="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_310px] gap-5 mb-5">
    <section id="map" class="panel p-4 sm:p-5" aria-labelledby="map-h">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h2 id="map-h" class="h2" data-i18n="mapTitle"></h2>
        <div class="flex items-center gap-3">
          <span id="tog-label" class="text-sm" data-i18n="showUnowned"></span>
          <button id="tog" type="button" role="switch" aria-checked="true" aria-labelledby="tog-label" class="switch"><span class="knob"></span></button>
        </div>
      </div>
      <p id="map-sum" class="muted text-sm mt-1 mb-3"></p>
      <div id="filters" class="flex flex-wrap gap-2 mb-3" role="group" data-i18n-aria="filterAria"></div>
      <div class="bed"><div id="fields" class="grid-fields"></div></div>
    </section>

    <aside class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-1 gap-5 content-start">
      <section class="panel p-4" aria-labelledby="ops-h">
        <div class="flex items-baseline justify-between mb-1"><h2 id="ops-h" class="h2" data-i18n="opsTitle"></h2><span id="ops-sum" class="muted text-sm"></span></div>
        <ul id="ops"></ul>
      </section>
      <section class="panel p-4" aria-labelledby="yield-h">
        <h2 id="yield-h" class="h2 mb-1" data-i18n="yieldTitle"></h2>
        <p id="yield-sum" class="muted text-sm mb-1"></p>
        <ul id="yield"></ul>
      </section>
    </aside>
  </div>

  <!-- Farm Operations & Tasks Board -->
  <section id="tasks" class="panel p-4 sm:p-5 mb-5" aria-labelledby="tasks-h">
    <div class="flex flex-wrap items-baseline justify-between gap-2 mb-4">
      <div><h2 id="tasks-h" class="h2" data-i18n="tasksTitle"></h2><p class="muted text-sm" data-i18n="tasksSub"></p></div>
      <span id="task-sum" class="muted text-sm"></span>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-[340px_minmax(0,1fr)] gap-6">
      <form id="taskForm" class="space-y-4" novalidate>
        <div>
          <label class="lbl" for="fName" data-i18n="fTask"></label>
          <input id="fName" class="inp" list="taskList" autocomplete="off" data-i18n-ph="phTask">
          <datalist id="taskList"></datalist>
          <p id="fErr" class="text-xs mt-1" style="color:var(--clay)" role="alert"></p>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="lbl" for="fField" data-i18n="fField"></label><select id="fField" class="inp"></select></div>
          <div><label class="lbl" for="fPlayer" data-i18n="fPlayer"></label><input id="fPlayer" class="inp" list="playerList" autocomplete="off" data-i18n-ph="phPlayer"><datalist id="playerList"></datalist></div>
        </div>
        <fieldset>
          <legend class="lbl" data-i18n="fUrgency"></legend>
          <div class="seg">
            <label style="--c:var(--sky)"><input type="radio" name="urg" value="low"><span data-i18n="low"></span></label>
            <label style="--c:var(--gold)"><input type="radio" name="urg" value="medium" checked><span data-i18n="medium"></span></label>
            <label style="--c:var(--clay)"><input type="radio" name="urg" value="high"><span data-i18n="high"></span></label>
          </div>
        </fieldset>
        <button type="submit" class="btn w-full"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="addTask"></span></button>
      </form>

      <div>
        <div class="overflow-auto rounded-lg border" style="max-height:340px;border-color:var(--line)">
          <table class="tbl">
            <thead><tr>
              <th style="width:56px" data-i18n="colDone"></th><th data-i18n="colTask"></th><th data-i18n="colField"></th>
              <th data-i18n="colPlayer"></th><th data-i18n="colUrgency"></th><th style="width:44px"><span class="sr-only" data-i18n="colActions"></span></th>
            </tr></thead>
            <tbody id="taskBody"></tbody>
          </table>
        </div>
        <div class="flex justify-end mt-3"><button id="clearDone" type="button" class="btn ghost" data-i18n="clearDone"></button></div>
      </div>
    </div>
  </section>

  <!-- Machines -->
  <section id="machines" class="panel p-4 sm:p-5" aria-labelledby="mach-h">

const $ = id => document.getElementById(id);
const sum = a => a.reduce((x, y) => x + y, 0);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const opName = m => (m.helper ? t('helper', { n: m.helper }) : m.op || null);
const workOn = n => machines.find(m => m.field === n && m.status === 'working');
const fieldByN = n => fields.find(f => f.n === n);
let activeStage = 'all', showUnowned = true;
const visibleFields = () => fields.filter(f => f.owned || showUnowned);

function renderPlayers() {
  $('players').innerHTML = players.map(p => `<span title="${p.n}" class="inline-flex items-center justify-center w-8 h-8 rounded-full text-sm font-semibold" style="background:${p.c};color:#1A1917;border:2px solid var(--bg)">${p.n[0]}</span>`).join('');
}

function cardHTML(f) {
  const color = stageColor[f.stage] || '#B9A97F';
  const dim = activeStage !== 'all' && activeStage !== f.stage ? ' dim' : '';
  const pct = Math.max(0, Math.min(100, Number(f.pct) || 0));
  const w = f.owned ? workOn(f.n) : null;
  const footer = f.owned
    ? `<span class="g"><span class="truncate">${w ? esc(t(w.task) + ', ' + opName(w)) : t('noActivity')}</span></span>`
    : `<span class="g">${uiSvg('tag')}${t('forSale')}</span><span class="g" style="color:var(--text);font-weight:600">${uiSvg('coin')}${f.price != null ? money(f.price) : t('onRequest')}</span>`;
  return `<article class="fcard ${f.owned ? 'owned' : 'unowned'}${dim}" data-n="${f.n}" style="--f:${color}">
    <div class="row"><span class="num">${f.n}${w ? `<span class="live" title="${t('wip')}"></span>` : ''}</span><span class="ico">${cropImg(f.crop, 28)}</span></div>
    <div class="row"><span class="font-semibold text-[15px] truncate">${esc(cropName(f.crop))}</span><span class="sub" style="opacity:.8">${num1(f.ha)} ha</span></div>
    <div class="row sub"><span class="g"><span class="sd"></span>${esc(stageLabel(f.stage))}</span><span>${pct}%</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="row foot">${footer}</div></article>`;
}

function renderMap() {
  $('fields').innerHTML = visibleFields().map(cardHTML).join('');
  const owned = fields.filter(f => f.owned);
  $('map-sum').textContent = t('mapSum', { owned: owned.length, ha: num1(sum(owned.map(f => f.ha))), ready: owned.filter(f => f.stage === 'ready').length }) +
    (showUnowned ? t('mapSale', { n: fields.length - owned.length }) : '');
}

function renderFilters() {
  const list = visibleFields(), counts = {};
  list.forEach(f => counts[f.stage] = (counts[f.stage] || 0) + 1);
  const keys = [...STAGE_ORDER, ...Object.keys(counts).filter(k => !STAGE_ORDER.includes(k))];
  $('filters').innerHTML = `<button type="button" class="chip" data-stage="all" aria-pressed="${activeStage === 'all'}">${t('allFields')} ${list.length}</button>` +
    keys.map(k => `<button type="button" class="chip" data-stage="${esc(k)}" aria-pressed="${activeStage === k}"><span class="sd" style="--f:${stageColor[k] || '#B9A97F'}"></span>${esc(stageLabel(k))} ${counts[k] || 0}</button>`).join('');
}

function renderOps() {
  const ops = machines.filter(m => m.field && m.status === 'working').sort((a, b) => a.field - b.field);
  $('ops-sum').textContent = t('opsSum', { n: ops.length });
  $('ops').innerHTML = ops.length ? ops.map(m => {
    const f = fieldByN(m.field);
    return `<li class="item hit" tabindex="0" data-field="${m.field}"><span class="tile">${f ? cropImg(f.crop, 22) : ''}</span>
      <div class="min-w-0 flex-1"><div class="text-sm font-semibold">${t('fieldN', { n: m.field })}</div><div class="muted text-xs truncate">${esc(t(m.task) + ', ' + opName(m))}</div></div>
      <span class="dot" style="--d:var(--lime)" title="${t('s_working')}"></span></li>`;
  }).join('') : `<li class="muted text-sm py-3">${t('opsEmpty')}</li>`;
}

function renderYield() {
  const owned = fields.filter(f => f.owned);
  $('yield-sum').textContent = t('yieldSum', { n: owned.filter(f => f.stage === 'ready').length });
  $('yield').innerHTML = owned.filter(f => f.stage === 'growing').sort((a, b) => a.eta - b.eta || b.pct - a.pct).slice(0, 5).map(f => `
    <li class="item hit" tabindex="0" data-field="${f.n}"><span class="tile">${cropImg(f.crop, 22)}</span>
      <div class="min-w-0 flex-1"><div class="flex justify-between text-sm"><span class="font-semibold">${t('fieldN', { n: f.n })} <span class="muted font-normal">${esc(cropName(f.crop))}</span></span><span class="muted text-xs">${t(f.eta === 1 ? 'dayOne' : 'dayMany', { n: f.eta })}</span></div>
      <div class="bar mt-1.5"><i style="width:${f.pct}%;background:var(--lime)"></i></div></div></li>`).join('');
}

function renderMachines() {
  $('machList').innerHTML = machines.map(m => {
    const who = opName(m), loc2 = m.field ? `<span class="pill on">${t('fieldN', { n: m.field })}</span>` : `<span class="pill muted">${t(m.status === 'hauling' ? 'onRoad' : 'inYard')}</span>`;
    return `<li class="mcard hit" tabindex="0" ${m.field ? `data-field="${m.field}"` : ''}><span class="tile" style="color:var(--text)">${svg(ui[m.kind] || ui.tractor, 22)}</span>
      <div class="min-w-0 flex-1"><div class="font-semibold text-sm truncate">${esc(m.name)}</div>
      <div class="muted text-xs truncate">${esc(t(m.type))}</div><div class="muted text-xs truncate">${esc(t(m.task) + (who ? ', ' + who : ''))}</div>
      <div class="text-xs mt-1 flex items-center gap-1.5"><span class="dot" style="--d:${STATUS_DOT[m.status]}"></span>${t('s_' + m.status)}</div></div>${loc2}</li>`;
  }).join('');
  const act = machines.filter(m => m.status !== 'idle').length;
  $('mach-sum').textContent = t('machSum', { a: act, i: machines.length - act });
}

function renderFinance() {
  const inc = sum(income), mnt = sum(maint), max = Math.max(...income);
  $('balance').textContent = money(balance); $('inc').textContent = money(inc);
  $('mnt').textContent = '-' + money(mnt); $('net').textContent = '+' + money(inc - mnt);
  $('chart').innerHTML = income.map((v, i) => `<div class="flex-1 flex flex-col items-center gap-1 h-full justify-end">
    <div class="flex items-end gap-0.5 w-full justify-center flex-1">
      <div title="${t('income')}: ${money(v)}" style="width:44%;height:${(v / max) * 100}%;background:var(--lime);border-radius:2px 2px 0 0"></div>
      <div title="${t('maint')}: ${money(maint[i])}" style="width:44%;height:${Math.max(4, (maint[i] / max) * 100)}%;background:var(--clay);border-radius:2px 2px 0 0"></div>
    </div><span class="muted text-[10px]">${8 + i}</span></div>`).join('');
}

/* ---------- Task board ---------- */
const saveTasks = () => store.set('tasks', tasks);
const taskName = x => (x.nameKey ? t(x.nameKey) : x.name);

function renderForm() {
  const sel = $('fField'), cur = sel.value;
  sel.innerHTML = `<option value="">${t('yard')}</option>` + fields.filter(f => f.owned).map(f => `<option value="${f.n}">${t('fieldN', { n: f.n })}, ${esc(cropName(f.crop))}</option>`).join('');
  sel.value = cur;
  $('taskList').innerHTML = PRESETS.map(k => `<option value="${esc(t(k))}"></option>`).join('');
  $('playerList').innerHTML = players.map(p => `<option value="${p.n}"></option>`).join('');
}

function renderTasks(focusId) {
  const list = [...tasks].sort((a, b) => a.done - b.done || URG_RANK[a.urgency] - URG_RANK[b.urgency] || b.id - a.id);
  $('taskBody').innerHTML = list.length ? list.map(x => `
    <tr class="${x.done ? 'done' : ''}" ${x.field ? `data-field="${x.field}"` : ''}>
      <td><label class="chk"><input type="checkbox" data-id="${x.id}" ${x.done ? 'checked' : ''} aria-label="${esc(taskName(x))}"><span class="box"></span></label></td>
      <td class="font-medium">${esc(taskName(x))}</td>
      <td>${x.field ? t('fieldN', { n: x.field }) : t('yard')}</td>
      <td>${x.player ? esc(x.player) : `<span class="muted">${t('unassigned')}</span>`}</td>
      <td><span class="urg" style="--c:${URG_COLOR[x.urgency]}">${t(x.urgency)}</span></td>
      <td><button type="button" class="xbtn" data-del="${x.id}" aria-label="${t('removeTask')}">${uiSvg('x', 16)}</button></td></tr>`).join('')
    : `<tr><td colspan="6" class="muted text-center" style="padding:28px 10px">${t('noTasks')}</td></tr>`;
  const done = tasks.filter(x => x.done).length;
  $('task-sum').textContent = t('taskSum', { o: tasks.length - done, d: done });
  if (focusId) { const c = document.querySelector(`input[data-id="${focusId}"]`); if (c) c.focus(); }
}

$('taskForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('fName').value.trim();
  if (!name) { $('fErr').textContent = t('errTask'); $('fName').focus(); return; }
  $('fErr').textContent = '';
  tasks.push({ id: Date.now(), name, field: $('fField').value ? +$('fField').value : null, player: $('fPlayer').value.trim(), urgency: document.querySelector('input[name="urg"]:checked').value, done: false });
  saveTasks(); $('fName').value = ''; renderTasks(); $('fName').focus();
});
$('taskBody').addEventListener('change', e => {
  const c = e.target.closest('input[data-id]'); if (!c) return;
  const x = tasks.find(k => String(k.id) === c.dataset.id); if (x) x.done = c.checked;
  saveTasks(); renderTasks(c.dataset.id);
});
$('taskBody').addEventListener('click', e => {
  const b = e.target.closest('button[data-del]'); if (!b) return;
  tasks = tasks.filter(k => String(k.id) !== b.dataset.del); saveTasks(); renderTasks();
});
$('clearDone').addEventListener('click', () => { tasks = tasks.filter(x => !x.done); saveTasks(); renderTasks(); });
$('fName').addEventListener('input', () => { $('fErr').textContent = ''; });

/* ---------- Map controls and cross-highlighting ---------- */
$('filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  activeStage = activeStage === b.dataset.stage ? 'all' : b.dataset.stage; renderFilters(); renderMap();
});
$('tog').addEventListener('click', () => {
  showUnowned = !showUnowned; $('tog').setAttribute('aria-checked', String(showUnowned)); renderFilters(); renderMap();
});
function bindHighlight(el) {
  const set = (e, on) => { const r = e.target.closest('[data-field]'); if (!r) return; const c = document.querySelector(`.fcard[data-n="${r.dataset.field}"]`); if (c) c.classList.toggle('hl', on); };
  ['mouseover', 'focusin'].forEach(ev => el.addEventListener(ev, e => set(e, true)));
  ['mouseout', 'focusout'].forEach(ev => el.addEventListener(ev, e => set(e, false)));
}
['ops', 'yield', 'machList', 'taskBody'].forEach(id => bindHighlight($(id)));

/* ---------- Language switch ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $('lang').dataset.lang = lang;
  document.querySelectorAll('#lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  $('fErr').textContent = '';
  renderPlayers(); renderFinance(); renderFilters(); renderMap(); renderOps(); renderYield(); renderMachines(); renderForm(); renderTasks();
}
$('lang').addEventListener('click', e => {
  const b = e.target.closest('button[data-lang]'); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang; store.set('lang', lang); applyLang();
});

applyLang();
</script>

<script>
(() => {
  const gate = document.getElementById('authGate');
  const message = document.getElementById('authMessage');
  const errorBox = document.getElementById('authError');
  const spinner = document.getElementById('authSpinner');
  const login = document.getElementById('discordLogin');
  const gateLogout = document.getElementById('authLogout');
  const authUser = document.getElementById('authUser');
  const authAvatar = document.getElementById('authAvatar');
  const authUsername = document.getElementById('authUsername');

  const errors = {
    auth_failed: 'Die Discord-Anmeldung ist fehlgeschlagen. Bitte versuche es erneut.',
    discord_denied: 'Die Anmeldung wurde bei Discord abgebrochen.',
    invalid_state: 'Die Anmeldesitzung ist abgelaufen. Bitte starte die Anmeldung erneut.',
    no_code: 'Discord hat keinen Anmeldecode zurückgegeben.',
    session_failed: 'Die Sitzung konnte nicht gespeichert werden. Bitte versuche es erneut.'
  };

  function showGate(text, { showLogin = false, showLogout = false, loading = false } = {}) {
    document.body.classList.add('auth-locked');
    gate.hidden = false;
    message.textContent = text;
    login.hidden = !showLogin;
    gateLogout.hidden = !showLogout;
    spinner.hidden = !loading;
  }

  function unlock(user) {
    authUsername.textContent = user.username || 'Discord-Nutzer';
    if (user.avatar) {
      authAvatar.src = user.avatar;
      authAvatar.hidden = false;
    } else {
      authAvatar.hidden = true;
    }
    authUser.classList.remove('hidden');
    authUser.classList.add('flex');
    document.body.classList.remove('auth-locked');
    gate.hidden = true;
  }

  async function checkAuth() {
    try {
      const response = await fetch('/api/auth/me', { cache: 'no-store', credentials: 'same-origin' });
      const data = await response.json();

      if (!response.ok) throw new Error(data.error || 'auth_check_failed');
      if (!data.loggedIn) {
        showGate('Melde dich mit deinem Discord-Konto an, um das Farm-Dashboard zu öffnen.', { showLogin: true });
        return;
      }

      if (data.user.status === 'blocked') {
        showGate('Dein Zugriff auf dieses Dashboard wurde gesperrt.', { showLogout: true });
        return;
      }

      if (!data.user.is_approved) {
        showGate('Erfolgreich angemeldet. Dein Zugriff wartet noch auf die Freigabe durch den Administrator.', { showLogout: true, loading: true });
        window.setTimeout(checkAuth, 10000);
        return;
      }

      unlock(data.user);
    } catch (error) {
      console.error('Authentifizierungsprüfung fehlgeschlagen:', error);
      showGate('Der Anmeldestatus konnte gerade nicht geprüft werden. Bitte versuche es erneut.', { showLogin: true });
    }
  }

  const params = new URLSearchParams(window.location.search);
  const errorCode = params.get('error');
  if (errorCode) {
    errorBox.textContent = errors[errorCode] || 'Die Anmeldung konnte nicht abgeschlossen werden.';
    errorBox.hidden = false;
    window.history.replaceState({}, document.title, '/');
  }

  checkAuth();
})();
</script>
</body>
</html>
