<!-- Setze dies in den <head> deiner index.html falls noch nicht vorhanden -->
<script src="https://jsdelivr.net"></script>

<!-- Das angepasste Script ganz unten vor </body> -->
<script>
    const SUPABASE_URL = "DEINE_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "DEIN_SUPABASE_ANON_KEY";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    async function checkAuth() {
        const res = await fetch('/api/auth/me');
        const data = await res.json();
        
        const loginOverlay = document.getElementById('loginOverlay'); // Deine ID des Login-Elements
        const dashboard = document.getElementById('dashboardContent');
        const waitingOverlay = document.getElementById('waitingOverlay'); // Warteschleifen-Kasten falls nicht freigeschaltet

        if (!data.loggedIn) {
            // Zeige Login-Kasten mit "Mit Discord anmelden" Button
            loginOverlay.classList.remove('hidden');
            dashboard.classList.add('blur-bg');
            return;
        }

        currentUser = data.user;

        if (!currentUser.is_approved) {
            // Spieler eingeloggt, aber noch nicht vom Admin bestätigt
            loginOverlay.classList.add('hidden');
            waitingOverlay.classList.remove('hidden');
            dashboard.classList.add('blur-bg');
            return;
        }

        // Erfolgreich eingeloggt und freigeschaltet
        loginOverlay.classList.add('hidden');
        if(waitingOverlay) waitingOverlay.classList.add('hidden');
        dashboard.classList.remove('blur-bg');

        // Username und Avatar oben rechts rendern
        document.getElementById('activeUser').innerText = currentUser.username;
        if(currentUser.is_admin) {
            // Zeige Admin-Panel falls erwünscht
            loadPendingUsers();
        }

        initRealtime();
        loadFieldsFromDatabase();
    }

    function initRealtime() {
        supabase.channel('public:fields').on('postgres_changes', { event: '*', schema: 'public', table: 'fields' }, () => {
            loadFieldsFromDatabase();
        }).subscribe();
        
        supabase.channel('public:farm_stats').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'farm_stats' }, payload => {
            document.querySelector('.text-3xl.font-black.text-white').innerText = payload.new.money.toLocaleString('de-DE') + " \$";
        }).subscribe();
    }

    async function loadFieldsFromDatabase() {
        const { data: fields } = await supabase.from('fields').select('*').order('field_number', { ascending: true });
        const grid = document.getElementById('fieldsGrid');
        if (!grid || !fields) return;
        grid.innerHTML = '';

        fields.forEach(field => {
            const isUnowned = !field.is_owned;
            const cardHtml = `
                <div class="${isUnowned ? 'unowned-card bg-stone-900/45 border-stone-800' : 'bg-farm-green border-emerald-700'} p-4 rounded-xl border relative overflow-hidden flex flex-col justify-between h-32">
                    <div class="flex justify-between items-start">
                        <span class="text-2xl font-black ${isUnowned ? 'text-stone-500' : ''}">${field.field_number}</span>
                        <img src="assets/icons/${field.crop_type.toLowerCase()}.png" class="w-6 h-6 object-contain" onerror="this.outerHTML='🌾'">
                    </div>
                    <div>
                        <p class="text-sm font-bold truncate">${field.crop_type}</p>
                        <p class="text-xs font-medium tracking-wide">
                            ${isUnowned ? '💰 ' + field.price.toLocaleString('de-DE') + ' $' : '🌱 ' + field.growth_stage + ' (' + field.growth_percentage + '%)'}
                        </p>
                    </div>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', cardHtml);
        });
    }

    // Admin-Funktion: Zeige unbestätigte User an
    async function loadPendingUsers() {
        const { data: users } = await supabase.from('users').select('*').eq('is_approved', false);
        // Hier kannst du eine kleine Admin-Liste in der UI befüllen, um Spieler freizuschalten!
    }

    window.onload = checkAuth;
</script>
